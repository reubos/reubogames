<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>reubo's website</title>
  <style>
    body {
      background-color: #1a3a1a;
      color: #d4e8d4;
      font-family: 'Segoe UI', sans-serif;
      max-width: 700px;
      margin: 60px auto;
      padding: 0 20px;
    }

    h1 {
      font-size: 2rem;
      color: #000000;
      margin-bottom: 40px;
    }

    .game-list {
      list-style: none;
      padding: 0;
    }

    .game-list li {
      margin-bottom: 20px;
    }

    .game-list a {
      font-size: 1.3rem;
      color: #4ade80;
      text-decoration: none;
      font-weight: bold;
    }

    .game-list a:hover {
      color: #86efac;
      text-decoration: underline;
    }

    .game-list .desc {
      font-size: 0.9rem;
      color: #86a886;
      margin-top: 4px;
    }

    .footer {
      margin-top: 60px;
      color: #4a6b4a;
      font-style: italic;
    }

</head>
<body>
  <h1>reubo's website of games and random things</h1>

  <ul class="game-list">
    <li>
      <a href="tileshift/">Tileshift</a>

  </ul>

  <h2>Cow:</h2>
