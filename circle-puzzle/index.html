<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circle Puzzle — a turn on every tile</title>
<style>
  :root {
    --bg: #121316;
    --panel: #191b1f;
    --panel-2: #22252a;
    --line: #34383f;
    --text: #e8eaed;
    --muted: #9aa0a8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 20px 60px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  .backlink { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
  .backlink:hover { color: var(--text); }
  h1 { font-size: 1.7rem; margin: 10px 0 16px; font-weight: 600; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
  }
  #board { width: 100%; height: auto; display: block; user-select: none; cursor: pointer; }

  /* a piece is filled by its parts; the hairline is the fill again so the two
     sides of a colour boundary meet without the background showing through */
  .part { stroke-width: 0.006; }
  .cell { fill: none; stroke: #101114; stroke-linejoin: round; stroke-linecap: round; }

  /* the circles only show which one is taken; what is under the pointer is
     worked out from where it is, not from what it happens to be over */
  .hit { fill: none; stroke: none; pointer-events: none; }
  .hit.on { stroke: rgba(255, 255, 255, 0.8); }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0 0; }
  button, .toggle {
    font: inherit;
    font-size: 0.95rem;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 16px;
    cursor: pointer;
    user-select: none; -webkit-user-select: none;
  }
  button:hover, .toggle:hover { background: #2a2d32; border-color: #4b4f57; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; }
  .toggle input { accent-color: #6ea8fe; cursor: pointer; margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" href="../index.html">&#8592; Back to reubogames</a>

  <h1>Circle Puzzle</h1>

  <div class="panel">
    <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="controls">
    <button type="button" id="scramble">Scramble</button>
    <button type="button" id="reset">Reset puzzle</button>
    <label class="toggle"><input type="checkbox" id="invert">Invert controls</label>
  </div>

</div>

<script>
/* =====================================================================
   A TURN ON EVERY TILE

   The rhombitrihexagonal tiling, 3.4.6.4. A hexagon and the collar it wears —
   six squares across its edges, six triangles at its corners — thirteen tiles
   each with a colour of its own, each carrying the circle through its own
   corners, and each of those circles turns.

   What a circle may turn by is not its tile's own symmetry but what the cuts
   inside it will bear, since a turn has to land the pieces on ground cut the
   same way. About a hexagon the tiling repeats every sixth of a turn and about
   a triangle every third, so those go by 60° and 120°. A square has hexagons
   on two opposite sides and triangles on the other two, so on the tiling alone
   it can only go by a half.

   Ask for a quarter and the cuts have to be earned: every cut crossing a
   square's circle is copied round it a quarter at a time and kept inside. Each
   copy lands in the neighbouring circles and has to be copied round those in
   turn, and so on — but the asking stops. After five rounds nothing new is
   added, at 364 arcs on 104 circles, and the board is 181 pieces instead of
   the 91 a half turn would leave.

   The board is the ground those circles cover — the union of the discs. It
   cannot be the tiles themselves: a square's circle runs out to 2.073 from
   the middle where the tiles round the hexagon stop at 1.932, so it bulges
   into the hexagon beyond and would turn ground that was not there.
   ===================================================================== */

const S3 = Math.sqrt(3);
const PITCH = 1 + S3;                       // between hexagon centres

// lattice basis, 60° apart, as the tiling wants
const AX = PITCH * S3 / 2, AY = PITCH / 2;
const BX = 0, BY = PITCH;
const at = (a, b) => [a * AX + b * BX, a * AY + b * BY];
const key = (a, b) => a + ',' + b;

/* The board is a hexagon with the whole collar it wears: the six squares
   across its edges and the six triangles at its corners. Each of the thirteen
   owns a colour and turns on its own circle; anything else a circle reaches is
   grey.

   Twelve colours round the ring, a hue every thirtieth of the wheel, deep and
   pale by turns. The squares take the deep six and the triangles the pale six
   sitting between them, so a triangle differs from the square beside it by
   weight even where the hue is near, and from the next triangle round by a
   sixth of the wheel. */
const PLAY = [
  { sides: 6, deg: null, colour: 'white' },
  { sides: 4, deg: 30, colour: 'red' },
  { sides: 4, deg: 90, colour: 'yellow' },
  { sides: 4, deg: 150, colour: 'green' },
  { sides: 4, deg: 210, colour: 'cyan' },
  { sides: 4, deg: 270, colour: 'blue' },
  { sides: 4, deg: 330, colour: 'magenta' },
  { sides: 3, deg: 0, colour: 'peach' },
  { sides: 3, deg: 60, colour: 'lime' },
  { sides: 3, deg: 120, colour: 'mint' },
  { sides: 3, deg: 180, colour: 'sky' },
  { sides: 3, deg: 240, colour: 'lilac' },
  { sides: 3, deg: 300, colour: 'rose' },
];
const COLOURS = {
  white: '#f4f4f6',
  red: '#e0413d', yellow: '#dcc41e', green: '#37b257',
  cyan: '#1fb0bd', blue: '#3d5ce0', magenta: '#c744cb',
  peach: '#ffc094', lime: '#d2ee8c', mint: '#8eeec2',
  sky: '#93d2f7', lilac: '#bda6f7', rose: '#f89ec6',
  grey: '#6b7079',
};
const NAME = { 6: 'hexagon', 4: 'square', 3: 'triangle' };
// a quarter turn on the squares, which is what asks for the extra cuts below
const quarter = true;
// what the tiling repeats by about each kind of centre, which is what may turn
const STEP = { 6: Math.PI / 3, 4: Math.PI, 3: 2 * Math.PI / 3 };
const CIRCUM = { 6: 1, 4: Math.SQRT1_2, 3: 1 / S3 };

/* ---- the tiling ------------------------------------------------------

   A hexagon of side one on every lattice point, a square astride every
   lattice edge and a triangle on every lattice face. Straight edges: the
   circles are what cut here, so the tiles are the plain tiling. */

const HEXES = [];
for (let a = -2; a <= 2; a++)
  for (let b = -2; b <= 2; b++)
    if (Math.abs(a + b) <= 2) HEXES.push([a, b]);

const tiles = [];
const seen = new Set();
/* A point as a name, for asking what stands where. Rounded, and with zero
   made plain: a coordinate that lands a hair below nothing prints as -0.0000
   and would miss the very piece sitting on it. */
const round4 = v => { const r = +v.toFixed(4); return r === 0 ? 0 : r; };
const spot = p => round4(p[0]).toFixed(4) + ',' + round4(p[1]).toFixed(4);
const add = (sides, centre, poly) => {
  const k = sides + ':' + spot(centre);
  if (seen.has(k)) return;
  seen.add(k);
  tiles.push({ sides, centre, poly, colour: COLOURS.grey, plays: false });
};

for (const [a, b] of HEXES) {
  const c = at(a, b);
  const corner = k => [c[0] + Math.cos(k * Math.PI / 3), c[1] + Math.sin(k * Math.PI / 3)];
  add(6, c, [0, 1, 2, 3, 4, 5].map(corner));
  // a square outward from each edge, standing on the two corners of it
  for (let k = 0; k < 6; k++) {
    const p = corner(k), q = corner(k + 1);
    const mx = (p[0] + q[0]) / 2 - c[0], my = (p[1] + q[1]) / 2 - c[1];
    const d = Math.hypot(mx, my);
    const ux = mx / d, uy = my / d;
    const out = w => [w[0] + ux, w[1] + uy];
    add(4, [(p[0] + q[0]) / 2 + ux / 2, (p[1] + q[1]) / 2 + uy / 2],
        [p, q, out(q), out(p)]);
  }
  /* a triangle on each corner, standing on that corner and the far corners of
     the two squares beside it — which is the gap they leave between them */
  for (let k = 0; k < 6; k++) {
    const v = corner(k);
    const arm = j => {
      const p = corner(j), q = corner(j + 1);
      const mx = (p[0] + q[0]) / 2 - c[0], my = (p[1] + q[1]) / 2 - c[1];
      const d = Math.hypot(mx, my);
      return [v[0] + mx / d, v[1] + my / d];
    };
    const w1 = arm(k), w2 = arm(k - 1);
    add(3, [(v[0] + w1[0] + w2[0]) / 3, (v[1] + w1[1] + w2[1]) / 3], [v, w1, w2]);
  }
}

/* ---- the circles -----------------------------------------------------

   One on every tile, through its corners. Those on the board turn; the rest
   are there to cut, and they must be, or a turn would carry its pieces onto
   ground that had been divided differently. */

/* The seven that play, found by the direction they stand in from the middle.
   Everything else in the tiling is there to cut and to be turned about, but
   has no circle of its own and keeps the grey it was made with. */
for (const p of PLAY) {
  const want = p.deg === null ? null : p.deg * Math.PI / 180;
  let best = null, bd = Infinity;
  for (const t of tiles) {
    if (t.sides !== p.sides) continue;
    const d = Math.hypot(t.centre[0], t.centre[1]);
    if (want === null) { if (d < bd) { bd = d; best = t; } continue; }
    if (d > 2.2) continue;                  // only the ring about the middle
    let off = Math.atan2(t.centre[1], t.centre[0]) - want;
    while (off > Math.PI) off -= 2 * Math.PI;
    while (off < -Math.PI) off += 2 * Math.PI;
    if (Math.abs(off) < 1e-6 && d < bd) { bd = d; best = t; }
  }
  if (!best) throw new Error('no ' + NAME[p.sides] + ' standing at ' + p.deg);
  best.colour = COLOURS[p.colour];
  best.name = p.colour;
  best.plays = true;
}

const circles = tiles.map(t => ({
  tile: t, c: t.centre, r: CIRCUM[t.sides], sides: t.sides, turns: t.plays,
}));
const turners = circles.filter(c => c.turns);

/* ---- cutting ---------------------------------------------------------

   A region is a closed loop of edges, each a straight line or an arc of a
   known circle. Cutting one by a circle breaks it at the crossings into runs
   that lie on one side, then stitches the runs back together along the
   cutting circle — which matters, since a circle crossing a shape four times
   leaves one piece inside bounded by two separate runs. */

const vsub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const vlen = a => Math.hypot(a[0], a[1]);
const apart = (a, b) => vlen(vsub(a, b));
const alike = (a, b) => apart(a, b) < 1e-7;
const angAt = (Z, p) => Math.atan2(p[1] - Z[1], p[0] - Z[0]);
const edge = (from, to, centre, r) => ({ from, to, centre: centre || null, r: r || 0 });

function arcSpan(e) {
  const a = angAt(e.centre, e.from);
  let d = angAt(e.centre, e.to) - a;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  return { a, d };
}
function alongArc(e, p) {
  const { a, d } = arcSpan(e);
  let t = angAt(e.centre, p) - a;
  while (t > Math.PI) t -= 2 * Math.PI;
  while (t < -Math.PI) t += 2 * Math.PI;
  const u = d === 0 ? 0 : t / d;
  return u > 1e-6 && u < 1 - 1e-6;
}
function edgeMid(e) {
  if (!e.centre) return [(e.from[0] + e.to[0]) / 2, (e.from[1] + e.to[1]) / 2];
  const { a, d } = arcSpan(e);
  return [e.centre[0] + e.r * Math.cos(a + d / 2), e.centre[1] + e.r * Math.sin(a + d / 2)];
}
function edgeMeets(e, C, R) {
  const out = [];
  if (!e.centre) {
    const d = vsub(e.to, e.from), f = vsub(e.from, C);
    const a = d[0] * d[0] + d[1] * d[1];
    const b = 2 * (f[0] * d[0] + f[1] * d[1]);
    const c = f[0] * f[0] + f[1] * f[1] - R * R;
    let disc = b * b - 4 * a * c;
    if (disc <= 1e-9) return out;
    disc = Math.sqrt(disc);
    for (const t of [(-b - disc) / (2 * a), (-b + disc) / (2 * a)])
      if (t > 1e-6 && t < 1 - 1e-6) out.push([e.from[0] + d[0] * t, e.from[1] + d[1] * t]);
    return out;
  }
  const Z = e.centre, r = e.r, dv = vsub(C, Z), D = vlen(dv);
  if (D < 1e-9 || D > r + R - 1e-9 || D < Math.abs(r - R) + 1e-9) return out;
  const a = (r * r - R * R + D * D) / (2 * D);
  const h2 = r * r - a * a;
  if (h2 <= 0) return out;
  const h = Math.sqrt(h2);
  const mx = Z[0] + a * dv[0] / D, my = Z[1] + a * dv[1] / D;
  for (const s of [1, -1]) {
    const p = [mx + s * h * (-dv[1]) / D, my + s * h * dv[0] / D];
    if (alongArc(e, p)) out.push(p);
  }
  return out;
}
function loopArea(loop) {
  let a = 0;
  for (const e of loop) a += e.from[0] * e.to[1] - e.to[0] * e.from[1];
  a /= 2;
  for (const e of loop) {
    if (!e.centre) continue;
    const { d } = arcSpan(e);
    a += e.r * e.r / 2 * (d - Math.sin(d));
  }
  return a;
}
const flipLoop = l => l.slice().reverse().map(e => edge(e.to, e.from, e.centre, e.r));
const facing = l => (loopArea(l) < 0 ? flipLoop(l) : l);

function sliceLoop(loop, C, R) {
  loop = facing(loop);
  const edges = [];
  for (const e of loop) {
    const hits = edgeMeets(e, C, R);
    if (!hits.length) { edges.push(e); continue; }
    hits.sort((p, q) => apart(e.from, p) - apart(e.from, q));
    let cur = e;
    for (const p of hits) {
      if (alike(cur.from, p) || alike(cur.to, p)) continue;
      edges.push(edge(cur.from, p, cur.centre, cur.r));
      cur = edge(p, cur.to, cur.centre, cur.r);
    }
    edges.push(cur);
  }
  const side = edges.map(e => apart(edgeMid(e), C) < R);
  if (side.every(s => s)) return { in: [loop], out: [] };
  if (side.every(s => !s)) return { in: [], out: [loop] };
  let start = 0;
  while (side[start] === side[(start + edges.length - 1) % edges.length]) start++;
  const runs = [];
  for (let n = 0; n < edges.length; ) {
    const s = side[(start + n) % edges.length];
    const run = [];
    while (n < edges.length && side[(start + n) % edges.length] === s) {
      run.push(edges[(start + n) % edges.length]);
      n++;
    }
    runs.push({ side: s, edges: run, from: run[0].from, to: run[run.length - 1].to });
  }
  const turn = loopArea(loop) >= 0 ? 1 : -1;
  const nextRun = (p, dir, want) => {
    const a0 = angAt(C, p);
    let best = null, bestd = Infinity;
    for (const r of runs) {
      if (r.side !== want) continue;
      let d = (angAt(C, r.from) - a0) * dir;
      while (d <= 1e-7) d += 2 * Math.PI;
      if (d < bestd) { bestd = d; best = r; }
    }
    return best;
  };
  const got = { in: [], out: [] };
  for (const want of [true, false]) {
    const dir = want ? turn : -turn;
    const done = new Set();
    for (const r0 of runs) {
      if (r0.side !== want || done.has(r0)) continue;
      const out = [];
      let r = r0;
      for (let guard = 0; guard < runs.length + 2; guard++) {
        done.add(r);
        out.push(...r.edges);
        const nxt = nextRun(r.to, dir, want);
        if (!nxt) break;
        if (!alike(r.to, nxt.from)) out.push(edge(r.to, nxt.from, C, R));
        if (nxt === r0) break;
        r = nxt;
      }
      got[want ? 'in' : 'out'].push(out);
    }
  }
  return got;
}

/* ---- the pieces ------------------------------------------------------

   Every tile cut by every circle. A bit is kept when some turning circle
   holds it, which is what makes the board the ground the turns cover; bits
   of one tile agreeing on every circle are one piece, and a piece spanning
   two tiles wears both their colours. */

const midOf = pts => {
  let x = 0, y = 0;
  for (const p of pts) { x += p[0]; y += p[1]; }
  return [x / pts.length, y / pts.length];
};
const corners = loop => loop.map(e => e.from);
/* The middle of each arc as well as every corner, because the two pieces on
   either side of a boundary share their corners and would otherwise be marked
   at the same place; the arcs bulge opposite ways and tell them apart. */
const arcMids = loop => loop.filter(e => e.centre).map(e => {
  const { a, d } = arcSpan(e);
  return [e.centre[0] + e.r * Math.cos(a + d / 2), e.centre[1] + e.r * Math.sin(a + d / 2)];
});
/* A piece is marked at its middle of area. Its outline gets broken wherever a
   whole circle crosses it, and those breaks are not carried along by a turn —
   the middle of area is, because it does not care how the outline is cut up. */
function markOf(loops) {
  let area = 0, mx = 0, my = 0;
  for (const loop of loops) {
    let a = 0, px = 0, py = 0;
    for (const e of loop) {
      const cross = e.from[0] * e.to[1] - e.to[0] * e.from[1];
      a += cross;
      px += (e.from[0] + e.to[0]) * cross;
      py += (e.from[1] + e.to[1]) * cross;
    }
    a /= 2;
    if (Math.abs(a) > 1e-12) { area += a; mx += px / 6; my += py / 6; }
    for (const e of loop) {
      if (!e.centre) continue;
      const { a: a0, d } = arcSpan(e);
      const seg = e.r * e.r / 2 * (d - Math.sin(d));
      if (Math.abs(seg) < 1e-12) continue;
      const half = Math.abs(d) / 2;
      const far = 4 * e.r * Math.pow(Math.sin(half), 3) / (3 * (Math.abs(d) - Math.sin(Math.abs(d))));
      const th = a0 + d / 2;
      area += seg;
      mx += seg * (e.centre[0] + far * Math.cos(th));
      my += seg * (e.centre[1] + far * Math.sin(th));
    }
  }
  return [mx / area, my / area];
}

/* ---- what is really cut ----------------------------------------------

   A cut is an arc: a circle, and the run of it that is there. The tiling's own
   circles are whole. A circle only turns if what is cut inside it comes back
   onto itself, so every cut crossing a turning circle is copied round it and
   kept inside. That asking closes after a few rounds rather than running away,
   which is what lets a square turn by a quarter even though the tiling about
   its middle only repeats by a half. */

const TAU = 2 * Math.PI;
const norm = a => { a %= TAU; return a < 0 ? a + TAU : a; };
// a turned copy of a circle through the middle lands on -0, which is not 0 to a
// string, so every circle is named through the same rounding
const r5 = v => { const r = +v.toFixed(5); return r === 0 ? 0 : r; };
const nameOf = (c, r) => r5(c[0]).toFixed(5) + ',' + r5(c[1]).toFixed(5) + ',' + r.toFixed(5);
const STEP_OF = t => (quarter && t.sides === 4) ? Math.PI / 2 : STEP[t.sides];

// the run of circle X lying inside disc D: null, 'all', or [start, length]
function runInside(X, D) {
  const dx = D.c[0] - X.c[0], dy = D.c[1] - X.c[1], d = Math.hypot(dx, dy);
  if (d + X.r <= D.r + 1e-12) return 'all';
  if (d >= X.r + D.r - 1e-12 || d + D.r <= X.r + 1e-12) return null;
  const co = (X.r * X.r + d * d - D.r * D.r) / (2 * X.r * d);
  if (co >= 1) return null;
  if (co <= -1) return 'all';
  return [norm(Math.atan2(dy, dx) - Math.acos(co)), 2 * Math.acos(co)];
}
function runMeet(a, b) {
  const out = [];
  for (const shift of [-TAU, 0, TAU]) {
    const s = Math.max(a[0], b[0] + shift), e = Math.min(a[0] + a[1], b[0] + shift + b[1]);
    if (e - s > 1e-7) out.push([s, e - s]);
  }
  return out;
}
function cutArcs() {
  const tidy = q => (q.l >= TAU - 1e-9 ? { c: q.c, r: q.r, s: 0, l: TAU } : q);
  const key = q => nameOf(q.c, q.r) + ':' + norm(q.s).toFixed(5) + '+' + q.l.toFixed(5);
  const have = new Map();
  const add = q => { q = tidy(q); const k = key(q); if (have.has(k)) return null; have.set(k, q); return q; };
  for (const c of circles) {
    const q = { c: c.c.slice(), r: c.r, s: 0, l: TAU };
    if (turners.some(t => runInside(q, t))) add(q);
  }
  let front = [...have.values()];
  for (let round = 0; round < 20 && front.length; round++) {
    const born = [];
    for (const t of turners) {
      const step = STEP_OF(t);
      for (const q of front) {
        const span = runInside(q, t);
        if (!span) continue;
        const runs = span === 'all' ? [[q.s, q.l]]
          : (q.l >= TAU - 1e-9 ? [span] : runMeet([q.s, q.l], span));
        for (const [rs, rl] of runs) for (let k = 1; k * step < TAU - 1e-9; k++) {
          const a = k * step, co = Math.cos(a), si = Math.sin(a);
          const x = q.c[0] - t.c[0], y = q.c[1] - t.c[1];
          const got = add({ c: [t.c[0] + x * co - y * si, t.c[1] + x * si + y * co],
            r: q.r, s: norm(rs + a), l: rl });
          if (got) born.push(got);
        }
      }
    }
    front = born;
  }
  return [...have.values()];
}

const arcs = cutArcs();
const cutters = [];                       // the whole circles behind those arcs
const realRuns = [];                      // and which runs of each are really cut
{
  const at = new Map();
  for (const q of arcs) {
    const k = nameOf(q.c, q.r);
    let i = at.get(k);
    if (i === undefined) {
      i = cutters.length; at.set(k, i); cutters.push({ c: q.c, r: q.r }); realRuns.push([]);
    }
    realRuns[i].push([norm(q.s), q.l]);
  }
  for (const t of turners) t.at = at.get(nameOf(t.c, t.r));
}
/* Overlapping runs on one circle are the one stretch of cut. Merging them is
   what makes a run's ends mean something: they are where the cut stops, and a
   turn carries those onto each other just as it carries the cuts. */
for (let i = 0; i < realRuns.length; i++) {
  const runs = realRuns[i];
  if (runs.some(([, l]) => l >= TAU - 1e-9)) { realRuns[i] = [[0, TAU]]; continue; }
  const spans = runs.map(([s, l]) => [s, s + l]).sort((a, b) => a[0] - b[0]);
  const out = [];
  for (const [s, e] of spans) {
    const last = out[out.length - 1];
    if (last && s <= last[1] + 1e-7) last[1] = Math.max(last[1], e);
    else out.push([s, e]);
  }
  // the first and last may join round the back of the circle
  if (out.length > 1 && out[out.length - 1][1] - TAU >= out[0][0] - 1e-7) {
    out[0][0] = out[out.length - 1][0] - TAU;
    out.pop();
  }
  if (out.length === 1 && out[0][1] - out[0][0] >= TAU - 1e-9) realRuns[i] = [[0, TAU]];
  else realRuns[i] = out.map(([s, e]) => [norm(s), e - s]);
}
const isTurner = cutters.map((_, i) => turners.some(t => t.at === i));
const cutHere = (i, p) => realRuns[i].some(([s, l]) => {
  let d = norm(Math.atan2(p[1] - cutters[i].c[1], p[0] - cutters[i].c[0]) - s);
  if (d > TAU - 1e-7) d = 0;
  return d <= l + 1e-7;
});

const faces = [];
for (const t of tiles) {
  if (Math.hypot(t.centre[0], t.centre[1]) > 3.2) continue;   // past every disc
  let bits = [{ loop: facing(t.poly.map((p, i) => edge(p, t.poly[(i + 1) % t.poly.length]))), word: '' }];
  for (const c of cutters) {
    const next = [];
    for (const b of bits) {
      const s = sliceLoop(b.loop, c.c, c.r);
      for (const l of s.in) next.push({ loop: l, word: b.word + '1' });
      for (const l of s.out) next.push({ loop: l, word: b.word + '0' });
    }
    bits = next;
  }
  for (const b of bits) {
    if (Math.abs(loopArea(b.loop)) < 1e-7) continue;
    // kept only where a turning circle covers it — that is the board
    if (!isTurner.some((yes, i) => yes && b.word[i] === '1')) continue;
    b.tile = t;
    faces.push(b);
  }
}

/* Faces were cut by whole circles, but only the runs really cut divide
   anything. Where two faces meet along a stretch of circle no turn ever cut,
   they are the one piece; the rest of a face's edge is its outline. */
const wordAt = p => {
  let w = '';
  for (const c of cutters) w += (Math.hypot(p[0] - c.c[0], p[1] - c.c[1]) < c.r ? '1' : '0');
  return w;
};
const onCutter = e => {
  if (!e.centre) return -1;
  for (let i = 0; i < cutters.length; i++)
    if (Math.abs(e.r - cutters[i].r) < 1e-6 && Math.abs(e.centre[0] - cutters[i].c[0]) < 1e-6 &&
        Math.abs(e.centre[1] - cutters[i].c[1]) < 1e-6) return i;
  return -1;
};
let lostKin = 0;
const facesAt = new Map();
for (const f of faces) {
  const k = f.tile.sides + ':' + spot(f.tile.centre) + ':' + f.word;
  if (!facesAt.has(k)) facesAt.set(k, []);
  facesAt.get(k).push(f);
}
/* A run of cuts can end partway along an edge, so an edge is broken at every
   such end before being called cut or not. */
function alongRuns(e, i) {
  const runs = realRuns[i];
  if (runs.length === 1 && runs[0][1] >= TAU - 1e-9)      // cut the whole way round
    return [{ bit: e, mid: arcMids([e])[0] }];
  const { a, d } = arcSpan(e);
  const sgn = d < 0 ? -1 : 1, len = Math.abs(d);
  const marks = [0, len];
  for (const [rs, rl] of realRuns[i]) for (const end of [rs, rs + rl]) {
    const t = norm(sgn * (end - a));
    if (t > 1e-7 && t < len - 1e-7) marks.push(t);
  }
  marks.sort((x, y) => x - y);
  const at = t => [e.centre[0] + e.r * Math.cos(a + sgn * t), e.centre[1] + e.r * Math.sin(a + sgn * t)];
  const out = [];
  for (let k = 0; k + 1 < marks.length; k++) {
    if (marks[k + 1] - marks[k] < 1e-7) continue;
    out.push({ bit: edge(at(marks[k]), at(marks[k + 1]), e.centre, e.r),
      mid: at((marks[k] + marks[k + 1]) / 2) });
  }
  return out;
}

const boss = new Map(faces.map(f => [f, f]));
const find = f => (boss.get(f) === f ? f : (boss.set(f, find(boss.get(f))), boss.get(f)));
const join = (a, b) => { a = find(a); b = find(b); if (a !== b) boss.set(a, b); };
for (const f of faces) {
  f.show = [];
  for (const e of f.loop) {
    const i = onCutter(e);
    if (i < 0) { f.show.push(e); continue; }            // a side of the tile, always a cut
    for (const { bit, mid } of alongRuns(e, i)) {
      if (cutHere(i, mid)) { f.show.push(bit); continue; }
      // nothing cut here, so the face across the way is the same piece
      const c = cutters[i], away = f.word[i] === '1' ? 1 : -1;
      const n = [mid[0] + away * 1e-4 * (mid[0] - c.c[0]) / c.r,
                 mid[1] + away * 1e-4 * (mid[1] - c.c[1]) / c.r];
      const kin = facesAt.get(f.tile.sides + ':' + spot(f.tile.centre) + ':' + wordAt(n));
      if (!kin) { lostKin++; continue; }
      let best = kin[0], bd = Infinity;
      for (const g of kin) for (const p of corners(g.loop)) {
        const d = Math.hypot(p[0] - n[0], p[1] - n[1]);
        if (d < bd) { bd = d; best = g; }
      }
      join(f, best);
    }
  }
}
if (lostKin) console.warn(lostKin + ' joins had no face to join to');
const grouped = new Map();
for (const f of faces) {
  const r = find(f);
  if (!grouped.has(r)) grouped.set(r, []);
  grouped.get(r).push(f);
}
const board = [];
for (const bits of grouped.values()) {
  board.push({
    word: bits[0].word,
    sides: bits[0].tile.sides,
    parts: bits.map(b => ({ loop: b.loop, show: b.show })),
    home: bits[0].tile.colour,
    colour: bits[0].tile.colour,
    centre: markOf(bits.map(b => b.loop)),
  });
}

/* Which pieces each circle holds, and where a turn sends them. Read off by
   position: a piece is carried onto the piece standing where it lands, and
   the cuts repeating about that centre is what promises there is one. */
const where = p => spot(p);   // the mark alone; a turn may carry one kind of tile onto another
const spotOf = new Map(board.map(p => [where(p.centre), p]));
if (spotOf.size !== board.length) throw new Error('two pieces marked at one place');
for (const c of circles) {
  if (!c.turns) continue;
  c.holds = board.filter(p => p.word[c.at] === '1');
  const map = (ang) => {
    const co = Math.cos(ang), si = Math.sin(ang);
    const m = new Map();
    for (const p of c.holds) {
      const x = p.centre[0] - c.c[0], y = p.centre[1] - c.c[1];
      const to = spotOf.get(where([c.c[0] + x * co - y * si, c.c[1] + x * si + y * co]));
      if (!to) throw new Error('a circle that does not turn onto itself: ' + NAME[c.sides]);
      m.set(p, to);
    }
    if (new Set(m.values()).size !== m.size)
      throw new Error('a turn that is not a shuffle: ' + NAME[c.sides]);
    return m;
  };
  c.acw = map(STEP_OF(c));
  c.cw = map(-STEP_OF(c));
  c.deg = STEP_OF(c) * 180 / Math.PI;
}

/* ---- drawing ---------------------------------------------------------- */

const NS = 'http://www.w3.org/2000/svg';
const PAD = 0.12;
const svgEl = (name, attrs) => {
  const el = document.createElementNS(NS, name);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
};
const xy = p => p[0].toFixed(4) + ',' + p[1].toFixed(4);
function pathOf(loop) {
  let d = 'M' + xy(loop[0].from);
  for (const e of loop) {
    if (!e.centre) { d += 'L' + xy(e.to); continue; }
    const { d: sweep } = arcSpan(e);
    const big = Math.abs(sweep) > Math.PI ? 1 : 0;
    d += `A${e.r.toFixed(4)},${e.r.toFixed(4)} 0 ${big} ${sweep > 0 ? 1 : 0} ${xy(e.to)}`;
  }
  return d + 'Z';
}

/* Only what a circle cut: the straight sides a piece keeps from its own tile
   are the shape's own outline and are left to the colours to show. */
function arcsOf(loop) {
  let d = '';
  for (const e of loop) {
    if (!e.centre) continue;
    const { d: sweep } = arcSpan(e);
    const big = Math.abs(sweep) > Math.PI ? 1 : 0;
    d += 'M' + xy(e.from) +
      `A${e.r.toFixed(4)},${e.r.toFixed(4)} 0 ${big} ${sweep > 0 ? 1 : 0} ${xy(e.to)}`;
  }
  return d;
}

let root, ringLayer;
function render() {
  const svg = document.getElementById('board');
  root = svgEl('g', { transform: 'scale(1,-1)' });

  const fills = svgEl('g');
  for (const p of board)
    for (const part of p.parts) {
      part.el = svgEl('path', { class: 'part', d: pathOf(part.loop) });
      fills.appendChild(part.el);
    }

  // the circles, drawn where they cut and only if wanted
  ringLayer = svgEl('g', { 'stroke-width': '0.009' });
  for (const p of board) {
    p.el = svgEl('path', { class: 'cell', 'stroke-width': '0.009', d: p.parts.map(q => arcsOf(q.show)).join('') });
    ringLayer.appendChild(p.el);
  }

  const hits = svgEl('g', { 'stroke-width': '0.03' });
  for (const c of turners) {
    c.hit = svgEl('circle', { class: 'hit', cx: c.c[0], cy: c.c[1], r: c.r });
    hits.appendChild(c.hit);
  }

  root.append(fills, ringLayer, hits);
  svg.replaceChildren(root);

  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const c of turners) {
    x0 = Math.min(x0, c.c[0] - c.r); x1 = Math.max(x1, c.c[0] + c.r);
    y0 = Math.min(y0, c.c[1] - c.r); y1 = Math.max(y1, c.c[1] + c.r);
  }
  svg.setAttribute('viewBox',
    [x0 - PAD, -y1 - PAD, x1 - x0 + 2 * PAD, y1 - y0 + 2 * PAD].join(' '));

  /* Which circle the pointer is in: of the circles it is inside, the one whose
     middle is nearest. Laying the discs one over another instead would hand a
     whole circle to whichever sat on top, and the small ones sit on top. */
  const pointAt = ev => {
    const box = svg.getBoundingClientRect();
    const vb = svg.viewBox.baseVal;
    return [vb.x + (ev.clientX - box.left) / box.width * vb.width,
            -(vb.y + (ev.clientY - box.top) / box.height * vb.height)];
  };
  const nearest = p => {
    let best = null, near = Infinity;
    for (const c of turners) {
      const d = Math.hypot(p[0] - c.c[0], p[1] - c.c[1]);
      if (d < c.r && d < near) { near = d; best = c; }
    }
    return best;
  };
  let under = null;
  const mark = c => {
    if (under === c) return;
    if (under) under.hit.classList.remove('on');
    under = c;
    if (under) under.hit.classList.add('on');
  };
  svg.addEventListener('mousemove', ev => mark(nearest(pointAt(ev))));
  svg.addEventListener('mouseleave', () => mark(null));
  svg.addEventListener('click', ev => {
    const c = nearest(pointAt(ev));
    if (c) turn(c, clickDir());
  });
  svg.addEventListener('contextmenu', ev => {
    ev.preventDefault();
    const c = nearest(pointAt(ev));
    if (c) turn(c, -clickDir());
  });
}

const paint = () => {
  for (const p of board)
    for (const part of p.parts) {
      part.el.setAttribute('fill', p.colour);
      part.el.setAttribute('stroke', p.colour);
    }
};

/* ---- turning ---------------------------------------------------------- */

/* A turn is read off before any of it is written back: every piece takes the
   colours the piece it came from was wearing. */
function move(c, dir) {
  const map = dir > 0 ? c.acw : c.cw;
  const taken = [];
  for (const [from, to] of map) taken.push([to, from.colour]);
  for (const [to, colour] of taken) to.colour = colour;
}

const SPIN_MS = 190;
const ease = u => 1 - (1 - u) ** 3;
let spinning = null;
const settle = () => { if (spinning) spinning(); };

function spin(c, from, ms = SPIN_MS) {
  const els = c.holds.flatMap(p => [p.el, ...p.parts.map(q => q.el)]).concat(c.hit);
  const place = a => {
    const tr = `rotate(${a.toFixed(3)} ${c.c[0].toFixed(4)} ${c.c[1].toFixed(4)})`;
    for (const el of els) el.setAttribute('transform', tr);
  };
  let raf = 0, backstop = 0;
  const stop = () => {
    cancelAnimationFrame(raf);
    clearTimeout(backstop);
    for (const el of els) el.removeAttribute('transform');
    spinning = null;
  };
  const t0 = performance.now();
  const step = now => {
    const u = Math.min(1, Math.max(0, (now - t0) / ms));
    if (u < 1) { place(from * (1 - ease(u))); raf = requestAnimationFrame(step); }
    else stop();
  };
  place(from);
  spinning = stop;
  raf = requestAnimationFrame(step);
  backstop = setTimeout(stop, ms + 300);
}

let inverted = false;
const clickDir = () => (inverted ? -1 : 1);

function turn(c, dir) {
  settle();
  move(c, dir);
  paint();
  spin(c, -dir * c.deg);
}

function reset() {
  for (const p of board) p.colour = p.home;
  paint();
}

const SCRAMBLE = 400;
function scramble() {
  settle();
  for (let i = 0; i < SCRAMBLE; i++)
    move(turners[Math.floor(Math.random() * turners.length)], Math.random() < 0.5 ? 1 : -1);
  paint();
}

/* ---- the page --------------------------------------------------------- */

render();
reset();

document.getElementById('scramble').addEventListener('click', scramble);
document.getElementById('reset').addEventListener('click', () => { settle(); reset(); });
document.getElementById('invert').addEventListener('change', e => { inverted = e.target.checked; });

</script>
</body>
</html>
