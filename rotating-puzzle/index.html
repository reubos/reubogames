    // a macro disturbs whatever it disturbs, and has no triple to aim
    const lib = library.map(m => {
      let low = 9999;
      for (let i = 0; i < n; i++) if (m.p[i] !== i) low = Math.min(low, rank[tileOf[i]]);
      return { p: m.p, seq: m.seq, t3: null, low };
    });
    moves = cycles.concat(lib);
  }

  return { parts, n, gens, library, short, compose, invert, tileOf, tileParts,
           budget: recipe.budget, tries: recipe.tries,
           bases, prefixes, aim, support, cycles, order, rank, moves,
           reduce: !!recipe.reduce,
           /* A colouring is one letter to a part, so the string is both the
              board and the key it is remembered by. Colour names would not do:
              they are words, and a string of them cannot be indexed by part,
              which is what the permutations are written over. */
           read: () => parts.map(p => TOKEN[p.colour]).join(GAP),
           // and the colouring it is solved in: the point each part faces
           home: seat.flatMap(t => t.on.map(pt => TOKEN[colourAt(...pt)])).join(GAP) };
}

/* Runs of turns on the one hexagon come to a single turn, or to none, and the
   long way round a sixth-turn is the short way back. Applied until it settles,
   because collapsing one run can bring two others together. */
function simplifySolution(seq) {
  let out = seq, changed = true;
  while (changed) {
    changed = false;
    const next = [];
    for (let i = 0; i < out.length; ) {
      const hex = out[i] >> 1;
      let turn = 0, j = i;
      while (j < out.length && (out[j] >> 1) === hex) { turn += (out[j] & 1) ? -1 : 1; j++; }
      turn = ((turn % 6) + 6) % 6;
      const many = !turn ? 0 : (turn <= 3 ? turn : 6 - turn), dir = turn <= 3 ? 0 : 1;
      // only a run that actually came out shorter is worth going round again
      // for — saying so whenever a run was merged would never terminate
      if (many !== j - i) changed = true;
      for (let k = 0; k < many; k++) next.push(hex * 2 + dir);
      i = j;
    }
    out = next;
  }
  return out;
}

/* Window optimisation. The answer is a run of commutators laid end to end, and
   where one ends and the next begins they undo a good deal of each other, so
   stretches of it are longer than they need to be.

   Every permutation within six turns is already written down — the library was
   sifted out of that table — so tightening is a lookup and not a search. Take
   a stretch of the answer, work out what it does, and if the table knows a
   shorter run of turns that does the same, swap it in. What the stretch does
   is read off prefix permutations: if P[k] is what the first k turns come to,
   the stretch from i to j does P[i] undone and then P[j].

   Longest stretches first, since a long one swapped for six turns is the
   biggest win, and round again from the start after each swap: a swap changes
   what its neighbours sit next to, and the stretch that would not tighten
   before may tighten now. */
const TIGHTEN_WINDOW = 14;

function tightenSolution(seq) {
  const { n, gens, short, compose, invert } = kit;
  const ident = new Int16Array(n);
  for (let i = 0; i < n; i++) ident[i] = i;
  let out = seq.slice(), again = true;
  while (again) {
    again = false;
    const P = [ident];
    for (let k = 0; k < out.length; k++) P.push(compose(P[k], gens[out[k]]));
    for (let i = 0; i < out.length && !again; i++) {
      const undo = invert(P[i]);
      const far = Math.min(out.length, i + TIGHTEN_WINDOW);
      for (let j = far; j > i + 1; j--) {
        const found = short.get(compose(undo, P[j]).join(','));
        if (!found || found.length >= j - i) continue;
        out = out.slice(0, i).concat(found, out.slice(j));
        again = true;
        break;
      }
    }
  }
  return out;
}

/* Moves aimed at what is actually still wrong. A three-cycle is only worth
   trying if it touches a tile that is out of place, and near the end there are
   few of those, so the list stays short however many triples are indexed.
   Both ways round: the inverse of a three-cycle is the same three tiles cycled
   the other way, and only one of the two will be the one wanted. */
function aimedRepairs(state) {
  const { aim, bases, prefixes, compose, invert, tileOf, home } = kit;
  const bad = new Set();
  for (let i = 0; i < state.length; i++)
    if (state[i] !== home[i]) bad.add(tileOf[i]);
  if (!bad.size) return [];
  const back = seq => seq.slice().reverse().map(g => g ^ 1);
  const out = [];
  for (const [key, hit] of aim) {
    if (!key.split(',').some(x => bad.has(+x))) continue;
    const P = prefixes[hit.pi], c = bases[hit.ci];
    const p = compose(compose(P.p, c.p), invert(P.p));
    const seq = P.seq.concat(c.seq, back(P.seq));
    out.push({ p, seq });
    out.push({ p: invert(p), seq: back(seq) });
  }
  return out;
}

/* Placing the tiles one by one, in the order laid down when the kit was built.
   Scored on how many of that order are home, and once few parts are wrong, on
   the wrong parts alone — see the note beside PLACE_ENDGAME for why both are
   needed. One number covers the two, so "the best position so far" always
   means something and the search can be put back on it when it drifts. */
async function placeSolution(from, goal, walk, miss, onStep) {
  const { order, rank, tileParts, moves } = kit;
  const placed = s => {
    let j = 0;
    outer: for (; j < order.length; j++) {
      for (const i of tileParts[order[j]]) if (s[i] !== goal[i]) break outer;
    }
    return j;
  };
  const score = (pre, w) =>
    w <= PLACE_ENDGAME ? 100000 - w * 100 + pre : pre * 100 - w;
  const trail = m => {
    const seq = [];
    for (let node = m; node.via; node = node.back) seq.unshift(...node.via);
    return seq;
  };

  for (let attempt = 0; attempt < kit.tries; attempt++) {
    const t0 = performance.now();
    const root = { s: from, via: null, back: null, pre: placed(from), w: miss(from) };
    root.sc = score(root.pre, root.w);
    let beam = [root], top = root, idle = 0, relax = 0, round = 0;
    const seen = new Set([from]);
    while (performance.now() - t0 < kit.budget) {
      const endgame = beam[0].w <= PLACE_ENDGAME;
      // late on, only what touches a tile still wrong is worth trying
      const bad = new Set();
      if (endgame)
        for (let i = 0; i < beam[0].s.length; i++)
          if (beam[0].s[i] !== goal[i]) bad.add(kit.tileOf[i]);

      const cand = [];
      for (const b of beam) {
        const floor = Math.max(0, b.pre - relax);
        const ceiling = b.pre + PLACE_FOCUS + relax * 4;
        for (const m of moves) {
          if (endgame) {
            if (m.t3 && !m.t3.some(t => bad.has(t))) continue;
          } else {
            if (m.low < floor) continue;             // would disturb a placed tile
            if (m.t3 && m.low > ceiling) continue;   // too far ahead to be useful yet
          }
          const s = walk(b.s, m.p);
          if (seen.has(s)) continue;
          seen.add(s);
          const w = miss(s);
          if (w === 0) return trail({ via: m.seq, back: b });
          const pre = placed(s);
          cand.push({ s, via: m.seq, back: b, pre, w, sc: score(pre, w), r: Math.random() });
        }
      }
      if (!cand.length) break;
      cand.sort((x, y) => y.sc - x.sc || x.r - y.r);
      beam = cand.slice(0, SOLVE_BEAM);
      if (seen.size > SOLVE_SEEN_CAP) { seen.clear(); for (const b of beam) seen.add(b.s); }

      if (beam[0].sc > top.sc) { top = beam[0]; idle = 0; relax = 0; }
      else {
        idle++;
        for (const [after, r] of PLACE_RELAX) if (idle === after) relax = r;
        if (idle >= PLACE_GIVE_UP) break;
        // drifted below the best seen: go back to it rather than wander on
        if (idle % 6 === 0 && beam[0].sc < top.sc) beam = [top];
      }
      if (onStep) onStep(beam[0].w, beam[0].pre, order.length);
      if (++round % 2 === 0) await new Promise(r => setTimeout(r, 0));
    }
  }
  return null;
}

/* =====================================================================
   SOLVING A BANDAGED BOARD

   A turn shifts the colours the same way whether or not anything is glued, so
   every permutation already worked out still holds. What changes is which runs
   of turns may be made at all, and where the bandages finish.

   From a scrambled arrangement barely one move in fifty of the library is
   playable; from the home arrangement it is one in three. So the bandages are
   walked home first — there are only 153 arrangements on three circles and
   72,259 on seven, so the shortest legal way home from every one of them is a
   breadth-first search done once. After that the board is solved with runs
   that put the bandages back where they found them. Those runs compose, so
   among them the bandages can be forgotten.

   And it cannot come unstuck for want of reach: a legal run from solved that
   ends with the bandages home is itself one of those runs, so whatever
   colouring the walk home leaves is one they can undo.

   Three things the board then insists on.

   The tiles under the bandages are not ordinary tiles. A glued trio travels as
   one piece for ever, so no three-tile move can touch those places and they
   have to be seated first — which is its own small puzzle, six blocks over six
   places on seven circles, solved outright rather than searched.

   The free tiles want moves aimed at them, and one aimed move per trio is not
   enough: the same three tiles cycled with a different twist is a different
   tool, and keeping only one threw away every twist the endgame needs.

   And parity. Where every free triangle is a distinct piece, a residual that
   swaps two of them is odd, and three-cycles and twists — all even — can never
   finish it. It is read off the colours after seating and put right with one
   odd move, after which only even moves may play or the fix is undone.
   ===================================================================== */

let bandKit = null;                         // built on demand, one board's

async function buildBandKit(onStep, from) {
  const breathe = async m => { if (onStep) onStep(m); await new Promise(r => setTimeout(r, 0)); };
  const recipe = RECIPE[puzzle.recipe];
  const deepest = recipe.bandDepth + BAND_DEEPEN;
  const start = Math.min(from || recipe.bandDepth, deepest);
  const n = kit.n, tileOf = kit.tileOf, back = s => s.slice().reverse().map(g => g ^ 1);
  const board = pieces;
  const at = new Map(board.map((t, i) => [t, i]));

  // the bandage model: what each ring holds, and where a turn takes it
  const holds = turners.map(h => new Set(h.collar.map(t => at.get(t))));
  const goTile = turners.map(h => [h.goACW, h.goCW].map(m => {
    const a = new Int16Array(board.length);
    for (let i = 0; i < board.length; i++) a[i] = i;
    for (const [from, to] of m) a[at.get(from)] = at.get(to);
    return a;
  }));
  const HOME = homeBands().map(b => b.map(t => at.get(t)).sort((x, y) => x - y));
  const cfgKey = cfg => cfg.map(b => b.join('.')).sort().join('|');
  const HOMEKEY = cfgKey(HOME);
  const canTurn = (cfg, h) => cfg.every(b => {
    let m = 0;
    for (const t of b) if (holds[h].has(t)) m++;
    return m === 0 || m === b.length;
  });
  const shove = (cfg, h, dir) => {
    const g = goTile[h][dir];
    return cfg.map(b => b.every(t => holds[h].has(t))
      ? b.map(t => g[t]).sort((x, y) => x - y) : b);
  };
  const playable = (cfg, seq) => {
    let c = cfg;
    for (const g of seq) {
      if (!canTurn(c, g >> 1)) return null;
      c = shove(c, g >> 1, g & 1);
    }
    return c;
  };

  /* The way back to where the bandages started, looked for when it is wanted
     rather than written down for every arrangement there is.

     Writing them all down is what took the page out of memory. The shipped
     bandagings have 153 and 72,259 arrangements between them, but that is a
     fact about their shape and not a law: a lens of three tiles is held by one
     collar and can barely move, while a glued pair roams, and four glued pairs
     on the sixty-one tile board run into the millions. The table was built
     before anything else, so a bandaging like that died on the first step.

     Searching from both ends instead meets in the middle, holds only what it
     has actually walked, and is thrown away afterwards. Both ends are wanted
     because the graph is undirected — whatever turn is legal here can be
     turned straight back — and growing whichever side is smaller keeps it
     from fanning out on one side alone. */
  const WAY_CAP = 150000;                   // arrangements one search may hold
  const BALL_CAP = 80000;                   // the ground first walked around home
  const BALL_MAX = 320000;                  // the most it may grow to, asked or not
  /* The seating map's rim, and how far a colouring may reach in from outside
     it. The rim is set past the largest closure any solvable board has shown
     — 276,480 — so every bandaging that fit in memory before is still
     answered exactly, and one that would not fit is met at the rim instead
     of run to the end. */
  const SEAT_BALL = 300000;
  const SEAT_REACH = 60000;

  /* The ground around home, walked once and kept: for every arrangement it
     holds, the turns that take the bandages home from there. The seating
     probe below asks the way home over and over, and every asking used to
     walk this same ground again from scratch — on the bandagings that widen
     their net a few times, that walking was nearly the whole of a build that
     ran to minutes. On the two shipped bandagings the ball holds the entire
     graph, and asking the way home is not a search at all. */
  await breathe('walking the ground around home');
  const ball = new Map([[HOMEKEY, []]]);
  const ballQ = [{ cfg: HOME, key: HOMEKEY }];
  let ballAt = 0;
  /* Walked breadth-first off a queue rather than in layers, so the walking
     can stop at any size and be taken up again exactly where it stood — an
     arrangement the first search cannot reach may still be met by walking
     the ground a stretch further. Ground walked over is let go of as the
     queue passes it; the ways home themselves live in the ball. */
  const growBall = to => {
    while (ballAt < ballQ.length && ball.size < to) {
      const it = ballQ[ballAt];
      ballQ[ballAt++] = null;
      const way = ball.get(it.key);
      for (let h = 0; h < turners.length; h++) {
        if (!canTurn(it.cfg, h)) continue;
        for (const dir of [0, 1]) {
          const c = shove(it.cfg, h, dir), ck = cfgKey(c);
          if (ball.has(ck)) continue;
          // the step found is the one that got here, so the way home is
          // its undoing, in front of the way home from where it started
          ball.set(ck, [h * 2 + (dir ^ 1)].concat(way));
          ballQ.push({ cfg: c, key: ck });
        }
      }
    }
  };
  growBall(BALL_CAP);

  /* The way home from anywhere: on known ground it is read straight off, and
     from further out a search runs until it steps onto the ball. A search
     that runs out of room without meeting it is not the end — the ball is
     grown a stretch and the search tried over, until the two meet or there
     is no more ground to give. */
  const seek = cfg => {
    const key = cfgKey(cfg);
    const known = ball.get(key);
    if (known) return known.slice();
    const ahead = new Map([[key, []]]);
    let front = [{ cfg, key }];
    while (front.length) {
      const next = [];
      for (const it of front) {
        const way = ahead.get(it.key);
        for (let h = 0; h < turners.length; h++) {
          if (!canTurn(it.cfg, h)) continue;
          for (const dir of [0, 1]) {
            const c = shove(it.cfg, h, dir), ck = cfgKey(c);
            if (ahead.has(ck)) continue;
            const step = way.concat(h * 2 + dir);
            const met = ball.get(ck);
            if (met) return step.concat(met);
            ahead.set(ck, step);
            next.push({ cfg: c, key: ck });
            if (ahead.size >= WAY_CAP) return null;
          }
        }
      }
      front = next;
    }
    return null;
  };
  const wayHome = cfg => {
    for (;;) {
      const way = seek(cfg);
      if (way) return way;
      if (ballAt >= ballQ.length || ball.size >= BALL_MAX) return null;
      growBall(ball.size + BALL_CAP);
    }
  };

  /* Runs that put the bandages back are closed walks at home, and two ways out
     to the same arrangement make one. The routes kept must come in by
     different ways, though: routes sharing a last turn pair into walks where
     that turn and its undoing cancel, leaving a shorter walk over again.

     How far out to go is not fixed. The keepers are what everything else is
     built from, and a bandaging the player invented can need a wider net than
     one the puzzle ships with — so the depth is a knob here, turned up below
     until the seating holds. Going deeper costs little: the walk stops at
     every arrangement the first time it reaches it, and there are only so
     many arrangements, so depth decides how much of that graph is seen and
     not how much work each part of it takes. */
  /* Both of these are held to a size a page can afford. The arrangements the
     walk goes out over, and the keepers made by pairing its routes, are only
     small for the shipped bandagings because a lens of three tiles hardly
     moves; loose groups fan out until the tab dies. Neither cap comes near
     what the shipped puzzles ask for — they want 9,060 keepers at the most —
     so the ceiling is only ever met by a bandaging that would not have
     finished anyway, and meeting it yields a smaller library rather than no
     library at all. */
  const ROUTE_CAP = 120000;                 // arrangements the walk goes out over
  const KEEP_CAP = 30000;                   // moves that put the bandages back
  let capped = false;

  const keepers = [], seenK = new Set();
  const keep = (p, seq) => {
    const pk = p.join(',');
    if (seenK.has(pk)) return null;
    seenK.add(pk);
    const m = { p, seq, sup: kit.support(p) };
    keepers.push(m);
    return m;
  };
  const permOf = seq => {
    let p = null;
    for (const g of seq) p = p === null ? kit.gens[g] : kit.compose(p, kit.gens[g]);
    return p;
  };
  const harvest = depth => {
    keepers.length = 0;
    seenK.clear();
    const routes = new Map([[HOMEKEY, [[]]]]);
    let edge = [{ cfg: HOME, key: HOMEKEY }];
    for (let d = 0; d < depth; d++) {
      const next = [];
      for (const { cfg, key } of edge) {
        const way = routes.get(key)[0];
        for (let h = 0; h < turners.length; h++) {
          if (!canTurn(cfg, h)) continue;
          for (const dir of [0, 1]) {
            const c = shove(cfg, h, dir), ck = cfgKey(c);
            let list = routes.get(ck);
            if (!list) {
              if (routes.size >= ROUTE_CAP) { capped = true; continue; }
              routes.set(ck, list = []);
              next.push({ cfg: c, key: ck });
            }
            if (list.length < 8) list.push(way.concat(h * 2 + dir));
          }
        }
      }
      edge = next;
    }
    for (const ways of routes.values()) {
      if (keepers.length >= KEEP_CAP) { capped = true; break; }
      for (let j = 1; j < ways.length; j++) {
        const a = ways[0].concat(back(ways[j]));
        if (a.length) keep(permOf(a), a);
        const b = ways[j].concat(back(ways[0]));
        if (b.length) keep(permOf(b), b);
      }
    }
  };

  // ---- the glued blocks ---------------------------------------------------
  const tileParts = kit.tileParts;
  const blockTiles = new Set();
  for (const b of HOME) for (const t of b) blockTiles.add(t);
  const blockParts = [];
  for (const t of blockTiles) for (const i of tileParts[t]) blockParts.push(i);
  const movable = [];
  for (let t = 0; t < board.length; t++) if (tileParts[t] && tileParts[t].length > 1) movable.push(t);
  const freeTiles = movable.filter(t => !blockTiles.has(t));

  /* A glued block can only sit where a bandage sits, so a keeper projects to a
     permutation of the block places alone, and one Dijkstra out from the
     seated colouring reaches every block colouring that can arise.

     It is not run to the end, though. A bandaging of loose pairs has hundreds
     of thousands of colourings, each tried against thousands of actions, and
     writing the whole table down took over a minute — for a table only ever
     asked about a dozen probes and the one colouring on the board. So the
     search is kept where it stands and grown on demand: asked about a
     colouring it holds, it answers at once; asked about one it has not
     reached, it walks on until it reaches it or has walked everywhere. The
     work of proving a colouring unreachable is the whole closure still, but
     it is paid once, and the common asking pays only its share. */
  await breathe('working out how to seat the glued pieces');
  const bpAt = new Int16Array(n).fill(-1);
  blockParts.forEach((i, j) => { bpAt[i] = j; });
  const goalBlocks = blockParts.map(i => kit.home[i]).join(GAP);
  const walkOn = (s, p) => {
    let o = GAP;
    for (let i = 0; i < p.length; i++) o += s[p[i]];
    return o;
  };

  const seatSearch = () => {
    const actions = new Map();
    for (const m of keepers) {
      const bp = new Int16Array(blockParts.length);
      let moves = false;
      for (let j = 0; j < blockParts.length; j++) {
        const to = bpAt[m.p[blockParts[j]]];
        if (to < 0) throw new Error('a keeper that breaks a block');
        bp[j] = to;
        if (to !== j) moves = true;
      }
      if (!moves) continue;
      const key = bp.join(',');
      const had = actions.get(key);
      if (!had || had.seq.length > m.seq.length) actions.set(key, { bp, p: m.p, seq: m.seq });
    }
    const found = new Map([[goalBlocks, { cost: 0, act: null }]]);
    // through a buffer of codes, not a run of concatenations: this is the
    // innermost loop of the whole build, run once per colouring per action
    const buf = new Array(blockParts.length);
    const bApply = (str, bp) => {
      for (let j = 0; j < bp.length; j++) buf[j] = str.charCodeAt(bp[j]);
      return String.fromCharCode.apply(null, buf);
    };
    const undo = [...actions.values()].map(a => {
      const r = new Int16Array(a.bp.length);
      for (let j = 0; j < a.bp.length; j++) r[a.bp[j]] = j;
      return { bp: r, a };
    });
    const q = [{ cost: 0, key: goalBlocks }];
    const push = it => {
      q.push(it);
      let i = q.length - 1;
      while (i > 0) {
        const p = (i - 1) >> 1;
        if (q[p].cost <= q[i].cost) break;
        [q[p], q[i]] = [q[i], q[p]];
        i = p;
      }
    };
    const pop = () => {
      const top = q[0], last = q.pop();
      if (q.length) {
        q[0] = last;
        let i = 0;
        for (;;) {
          const l = 2 * i + 1, r = l + 1;
          let m = i;
          if (l < q.length && q[l].cost < q[m].cost) m = l;
          if (r < q.length && q[r].cost < q[m].cost) m = r;
          if (m === i) break;
          [q[i], q[m]] = [q[m], q[i]];
          i = m;
        }
      }
      return top;
    };
    /* The seating for one colouring: what is already reached is answered from
       the map, and the search walks further only for one it has not met. An
       answer's chain of actions runs through colourings reached before it, so
       everything a caller follows is already written down.

       The walking stops at a rim. Eight glued lenses have millions of
       colourings between them, and a closure left to run to the end was what
       took the memory; within the rim the map is exact, and past it a
       colouring is met from its own side — the actions played forwards from
       it until it steps onto ground the map holds, the same meeting in the
       middle that finds the bandages their way home. The steps of a path
       found that way are kept, so the chain can still be walked one lookup
       at a time. */
    let complete = false;
    const extra = new Map();                // steps of the paths met from outside
    const grow = target => {
      const had = found.get(target) || extra.get(target);
      if (had) return had;
      // on toward the asking, stopping at the rim or when it is reached
      while (q.length && found.size < SEAT_BALL) {
        const { cost, key } = pop();
        if (found.get(key).cost !== cost) continue;
        for (const { bp, a } of undo) {
          const nk = bApply(key, bp), nc = cost + a.seq.length;
          const prev = found.get(nk);
          if (prev && prev.cost <= nc) continue;
          found.set(nk, { cost: nc, act: a });
          push({ cost: nc, key: nk });
        }
        const hit = found.get(target);
        if (hit) return hit;
      }
      if (!q.length) complete = true;
      if (complete) return null;            // the map is everything there is
      // out from the colouring itself, playing actions forwards, to the rim
      const seen = new Map([[target, null]]);
      let edge = [target];
      for (let d = 0; d < 6 && edge.length; d++) {
        const next = [];
        for (const key of edge)
          for (const a of undo) {
            const nk = bApply(key, a.a.bp);
            if (seen.has(nk)) continue;
            seen.set(nk, { from: key, act: a.a });
            if (found.get(nk)) {
              // walked back from the meeting to the asking, writing down the
              // action to play at each colouring along the way
              let at = nk;
              for (;;) {
                const step = seen.get(at);
                if (!step) break;
                extra.set(step.from, { cost: 0, act: step.act });
                at = step.from;
              }
              return extra.get(target);
            }
            next.push(nk);
            if (seen.size >= SEAT_REACH) return null;
          }
        edge = next;
      }
      return null;
    };
    return { grow, found };
  };

  /* Whether that table can seat what play actually throws up.

     It is a closure over the block side of the keepers harvested, and nothing
     says a harvest generates the whole of what the blocks can be left in — a
     shallow one often does not, and then a position arrives that the table has
     no entry for and the answer is given up on before any searching is done.
     So the table is tried against random legal play before it is trusted.

     The trial is run in the solver's own model rather than on the board, since
     the board is sitting in the very position the player is waiting to have
     solved. Play wanders from home, the bandages are walked back, and the
     blocks are looked up: a colouring that is not there is the failure, and
     the answer is to harvest wider. */
  const SEAT_PROBES = 12, SEAT_PLAY = 300;
  const seatsHold = seats => {
    for (let probe = 0; probe < SEAT_PROBES; probe++) {
      let cfg = HOME, s = kit.home;
      for (let i = 0; i < SEAT_PLAY; i++) {
        const open = [];
        for (let h = 0; h < turners.length; h++) if (canTurn(cfg, h)) open.push(h);
        if (!open.length) break;
        const h = open[Math.floor(Math.random() * open.length)];
        const dir = Math.random() < 0.5 ? 0 : 1;
        s = walkOn(s, kit.gens[h * 2 + dir]);
        cfg = shove(cfg, h, dir);
      }
      const way = wayHome(cfg);
      if (!way) return false;
      for (const g of way) s = walkOn(s, kit.gens[g]);
      if (!seats.grow(blockParts.map(i => s[i]).join(GAP))) return false;
    }
    return true;
  };

  await breathe('gathering the moves that put the bandages back');
  let seats = null, seatGap = false, settled = start;
  for (let depth = start; ; depth++) {
    settled = depth;
    harvest(depth);
    await breathe('working out how to seat the glued pieces');
    seats = seatSearch();
    if (seatsHold(seats)) break;
    // going further out cannot help once the net is already being trimmed
    if (depth >= deepest || capped) { seatGap = true; break; }
    await breathe('the glued pieces need a wider net — looking one turn further');
  }

  // ---- aimed cycles over the free tiles -----------------------------------
  await breathe('building the moves that aim at single tiles');
  const seeds = keepers.slice().sort((a, b) => a.sup - b.sup || a.seq.length - b.seq.length)
    .slice(0, 700);
  /* Seven hundred seeds against each other is half a million commutators, and
     on a loose bandaging a great many of them come out as three-cycles. Each
     is a permutation and a word kept for good, so they are counted. The
     shipped boards find far fewer than this and are untouched by it. */
  const CYCLE_CAP = 60000;
  const cycles = [];
  outer: for (const X of seeds) {
    const Xi = kit.invert(X.p);
    for (const Y of seeds) {
      const p = kit.compose(kit.compose(kit.compose(X.p, Y.p), Xi), kit.invert(Y.p));
      if (kit.support(p) !== 3) continue;
      const m = keep(p, X.seq.concat(Y.seq, back(X.seq), back(Y.seq)));
      if (m) cycles.push(m);
      if (cycles.length >= CYCLE_CAP) { capped = true; break outer; }
    }
  }
  const tripleOf = p => {
    const s = new Set();
    for (let i = 0; i < n; i++) if (p[i] !== i) s.add(tileOf[i]);
    return [...s].sort((x, y) => x - y);
  };
  for (const c of cycles) c.t3 = tripleOf(c.p);
  // the same three tiles twisted differently is a different tool, so keep them
  const variants = new Map();
  for (const c of cycles) {
    const key = c.t3.join(',');
    let list = variants.get(key);
    if (!list) variants.set(key, list = new Map());
    let sig = GAP;
    for (const t of c.t3) for (const j of tileParts[t]) sig += ',' + c.p[j];
    const had = list.get(sig);
    if (!had || had.seq.length > c.seq.length) list.set(sig, c);
  }

  await breathe('carrying those moves round the board');
  const conjMaps = new Map();
  for (const m of keepers) {
    if (m.seq.length > 26) continue;
    const tm = new Int16Array(board.length);
    for (let i = 0; i < n; i++) tm[tileOf[i]] = tileOf[m.p[i]];
    const mk = tm.join(',');
    const had = conjMaps.get(mk);
    if (!had || had.m.seq.length > m.seq.length) conjMaps.set(mk, { tm, m });
  }
  /* The cheapest of these, and no more than that. Every one of them is tried
     against every triple the orbit reaches, twice over — once for the cycles
     and once for the twists — so their number multiplies the two searches
     below rather than adding to them. Cheapest first is also the right few to
     keep: a triple reached by a dear map is reached by a long answer. */
  const CONJ_CAP = 6000;
  const conjs = [...conjMaps.values()].filter(c => c.tm.some((v, i) => v !== i))
    .sort((a, b) => a.m.seq.length - b.m.seq.length).slice(0, CONJ_CAP);

  /* Which triples an aimed cycle can be carried to is the orbit of the ones
     already had under those maps. Cheapest chain first, so a triple far from
     any base cycle is still reached by as few turns as it can be. */
  const reach = new Map();
  {
    const q = [];
    const push = it => {
      q.push(it);
      let i = q.length - 1;
      while (i > 0) {
        const p = (i - 1) >> 1;
        if (q[p].cost <= q[i].cost) break;
        [q[p], q[i]] = [q[i], q[p]];
        i = p;
      }
    };
    const pop = () => {
      const top = q[0], last = q.pop();
      if (q.length) {
        q[0] = last;
        let i = 0;
        for (;;) {
          const l = 2 * i + 1, r = l + 1;
          let m = i;
          if (l < q.length && q[l].cost < q[m].cost) m = l;
          if (r < q.length && q[r].cost < q[m].cost) m = r;
          if (m === i) break;
          [q[i], q[m]] = [q[m], q[i]];
          i = m;
        }
      }
      return top;
    };
    for (const [key, list] of variants) {
      let cheap = Infinity;
      for (const c of list.values()) cheap = Math.min(cheap, c.seq.length);
      reach.set(key, { cost: cheap, base: true, via: null });
    }
    for (const [key, node] of reach) push({ cost: node.cost, key });
    while (q.length) {
      const { cost, key } = pop();
      if (reach.get(key).cost !== cost) continue;
      const t3 = key.split(',').map(Number);
      for (const { tm, m } of conjs) {
        const nk = [tm[t3[0]], tm[t3[1]], tm[t3[2]]].sort((x, y) => x - y).join(',');
        const nc = cost + 2 * m.seq.length;
        const had = reach.get(nk);
        if (had && had.cost <= nc) continue;
        reach.set(nk, { cost: nc, base: false, via: { from: key, by: m } });
        push({ cost: nc, key: nk });
      }
    }
  }
  const built = new Map();
  const make = key => {
    if (built.has(key)) return built.get(key);
    const node = reach.get(key);
    let out;
    if (node.base) out = [...variants.get(key).values()].slice(0, 12)
      .map(c => ({ p: c.p, seq: c.seq }));
    else {
      const inner = make(node.via.from), P = node.via.by;
      const Pi = kit.invert(P.p), Pb = back(P.seq);
      out = inner.map(v => ({ p: kit.compose(kit.compose(P.p, v.p), Pi),
                              seq: P.seq.concat(v.seq, Pb) }));
    }
    built.set(key, out);
    return out;
  };
  /* Every triple the orbit reaches, materialised — up to a point. The orbit
     can span every triple of tiles on the board, which on sixty-one tiles is
     tens of thousands, each carrying a dozen variants both ways about; left
     alone that is millions of permutations kept at once. Nearest triples
     first, so what is dropped at the ceiling is what cost the most to get to. */
  const AIM_CAP = 150000;
  const aimed = [], seenAim = new Set();
  const byCost = [...reach.keys()].sort((a, b) => reach.get(a).cost - reach.get(b).cost);
  for (const key of byCost) {
    if (aimed.length >= AIM_CAP) { capped = true; break; }
    const t3 = key.split(',').map(Number);
    for (const v of make(key))
      for (const [p, seq] of [[v.p, v.seq], [kit.invert(v.p), back(v.seq)]]) {
        const pk = p.join(',');
        if (seenAim.has(pk)) continue;
        seenAim.add(pk);
        aimed.push({ p, seq, t3 });
      }
  }

  /* A tile turned where it stands is wrong in every part and out of place in
     none, and no three-tile move touches it alone. Two variants of one triple
     compose to exactly that: the tile motion cancels, the twist is left. */
  await breathe('building the moves that turn a tile in place');
  const byTriple = new Map();
  aimed.forEach((c, i) => {
    const key = c.t3.join(',');
    let l = byTriple.get(key);
    if (!l) byTriple.set(key, l = []);
    l.push(i);
  });
  let twists = [];
  const seenTw = new Set();
  for (const list of byTriple.values())
    for (const ci of list) for (const cj of list) {
      if (ci === cj) continue;
      const p = kit.compose(aimed[ci].p, aimed[cj].p);
      const sup = kit.support(p);
      if (sup === 0 || sup > 2) continue;
      const pk = p.join(',');
      if (seenTw.has(pk)) continue;
      seenTw.add(pk);
      twists.push({ p, seq: aimed[ci].seq.concat(aimed[cj].seq), t3: tripleOf(p) });
    }
  {
    const bestTw = new Map();
    for (const tw of twists) {
      const key = tw.t3.join(',');
      const had = bestTw.get(key);
      if (!had || had.seq.length > tw.seq.length) bestTw.set(key, tw);
    }
    const grow = [...bestTw.entries()].map(([key, tw]) => ({ key, tw }));
    while (grow.length) {
      const { key, tw } = grow.shift();
      const spots = key.split(',').map(Number);
      for (const { tm, m } of conjs) {
        const nk = spots.map(t => tm[t]).sort((x, y) => x - y).join(',');
        const nc = tw.seq.length + 2 * m.seq.length;
        const had = bestTw.get(nk);
        if (had && had.seq.length <= nc) continue;
        const p = kit.compose(kit.compose(m.p, tw.p), kit.invert(m.p));
        const nt = { p, seq: m.seq.concat(tw.seq, back(m.seq)), t3: nk.split(',').map(Number) };
        bestTw.set(nk, nt);
        grow.push({ key: nk, tw: nt });
      }
    }
    twists = [];
    for (const tw of bestTw.values()) {
      twists.push(tw);
      twists.push({ p: kit.invert(tw.p), seq: back(tw.seq), t3: tw.t3 });
    }
  }

  // ---- parity over the free triangles -------------------------------------
  const freeTri = freeTiles.filter(t => board[t].sides === 3);
  const triName = t => tileParts[t].map(i => kit.home[i]).sort().join(GAP);
  const triHome = new Map(freeTri.map(t => [triName(t), t]));
  // where two free triangles look alike, a swap of them is no obstruction at
  // all, and reading a parity off the colours would be reading it wrongly
  const triTold = triHome.size === freeTri.length;
  const cycleSign = to => {
    const seen = new Set();
    let sign = 0;
    for (const t of freeTri) {
      if (seen.has(t)) continue;
      let len = 0, x = t;
      do { seen.add(x); x = to.get(x); len++; } while (x !== t && !seen.has(x));
      if (len % 2 === 0) sign ^= 1;
    }
    return sign;
  };
  const triParity = s => {
    if (!triTold) return 0;
    const to = new Map();
    for (const t of freeTri) {
      const home = triHome.get(tileParts[t].map(i => s[i]).sort().join(GAP));
      if (home === undefined) return 0;
      to.set(t, home);
    }
    return cycleSign(to);
  };
  const moveSign = p => {
    if (!triTold) return 0;
    const to = new Map();
    for (const t of freeTri) to.set(t, tileOf[p[tileParts[t][0]]]);
    return cycleSign(to);
  };

  const blockSafe = keepers.filter(m => {
    for (const i of blockParts) if (m.p[i] !== i) return false;
    return true;
  });
  let fixer = null;
  for (const m of blockSafe) {
    if (!moveSign(m.p)) continue;
    if (!fixer || fixer.seq.length > m.seq.length) fixer = m;
  }
  // stage two must not undo the parity fix, so only even moves may play in it
  const evenSafe = blockSafe.filter(m => !moveSign(m.p))
    .map(m => ({ p: m.p, seq: m.seq, t3: null }));

  // ---- the order the free tiles are placed in -----------------------------
  const touch = new Map();
  for (const c of aimed) for (const t of c.t3) touch.set(t, (touch.get(t) || 0) + 1);
  const order = freeTiles.slice().sort((a, b) => (touch.get(a) || 0) - (touch.get(b) || 0));
  const rank = new Int16Array(board.length).fill(9999);
  order.forEach((t, j) => { rank[t] = j; });
  const moves = aimed.concat(twists, evenSafe);
  for (const m of moves) {
    let low = 9999;
    for (let i = 0; i < n; i++) if (m.p[i] !== i) low = Math.min(low, rank[tileOf[i]]);
    m.low = low;
  }

  /* Whether the library falls short. A free tile no three-cycle can touch is
     one the placing search can never put right, so the board cannot come out
     however long the search is given — and unlike a search that merely ran out
     of time, this is worth knowing before the searching starts.

     Measured over random fusings of the three-circle board it tells the two
     apart cleanly: every bandaging that beat the solver had a third or more of
     its free tiles out of reach, and every one the solver got had all or all
     but one of them in reach. */
  const touched = new Set();
  for (const m of moves) if (m.t3) for (const t of m.t3) touched.add(t);
  const short = order.some(t => !touched.has(t));

  return { HOME, cfgKey, canTurn, shove, playable, wayHome, keepers,
           seatWay: seats.grow, seated: seats.found,
           blockParts, goalBlocks, order, rank, moves, tileParts, fixer,
           triParity, board, seatGap, short, capped, depth: settled };
}

/* The tables, built again deeper if what came out cannot reach every tile.

   The depths in the recipe are what the two shipped bandagings want and no
   more. A bandaging the player invented can want a wider net, and the only
   way to know is to build and look: a harvest that stopped too soon leaves
   whole tiles with no move that touches them, and going a turn further out
   picks them up. Boards that come out short build quickly — being short is
   what makes them quick — so the throwing away costs little, and a board that
   is not short is never built twice. */
async function bandKitFor(onStep) {
  const recipe = RECIPE[puzzle.recipe];
  const deepest = recipe.bandDepth + BAND_DEEPEN;
  let bk = null;
  for (let d = recipe.bandDepth; ; d = bk.depth + 1) {
    bk = await buildBandKit(onStep, d);
    if (!bk.short || bk.depth >= deepest || bk.capped) return bk;
    if (onStep) onStep('the moves fall short of some tiles — looking further out');
    await new Promise(r => setTimeout(r, 0));
  }
}

/* Where the bandages are now, as the solver counts tiles. */
function bandNow(bk) {
  const board = bk.board, at = new Map(board.map((t, i) => [t, i]));
  return bands.map(b => b.tiles.map(t => at.get(t)).sort((x, y) => x - y));
}

/* Why the last attempt came to nothing, for the line under the board to say.
   A bandaged answer can fail before any searching is done — the tables are
   built at home and a position can fall outside them — and "no answer found"
   on its own would leave the player retrying something that cannot come out
   differently. */
let whyNoAnswer = '';

/* The last resort, and on a board glued nearly solid the best tool there is:
   the position itself — colours and bandages together — searched from both
   ends until the two meet. Heavy gluing is what starves the move library, a
   board can be glued so far that the harvest comes back with almost nothing,
   and then the machinery above has no material however long it looks. But
   heavy gluing is also what makes this search small: with a turn or two
   legal at a time, the positions reachable at all are few, and meeting in
   the middle covers the distance twice as fast as walking it. The cap is
   what keeps a rich board from drowning it — on one of those it fills up
   and gives up in a few seconds, and the answer stays no. */
const BRUTE_HOME = 500000;                  // positions held around home, once
const BRUTE_SEEK = 600000;                  // positions one solve may walk out
async function bandBrute() {
  const bk = bandKit;
  if (!bk) return null;
  const n = kit.n;
  /* A position's key is the board itself and a small number for where the
     bandages sit, and it is built flat in one stroke, read straight off the
     key before it. That is not fussiness: building these by appending a
     character at a time, and reading them back by slicing, left every entry
     dragging string machinery behind it — 2.2KB a position where a flat key
     is a tenth of that, measured — and the difference is the whole search
     seeing nine times further before the room runs out.

     A position remembers only the turn that reached it and where from; the
     way is read back along the chain when the two sides meet.

     The homeward side is the same ground whatever the scramble, so it is
     walked once and kept with the tables: the first direct solve pays for
     it, and every one after only walks out from its own scramble. A turn is
     playable at the position behind a homeward step exactly when it is
     playable at the step itself — a bandage wholly in the collar is wholly
     in it after the turn, and one outside is untouched — which is what lets
     home's side be walked backwards at all. */
  if (!bk.brute) {
    const ids = new Map(), cfgs = [];
    const idOf = cfg => {
      const k = bk.cfgKey(cfg);
      let i = ids.get(k);
      if (i === undefined) {
        ids.set(k, i = cfgs.length);
        cfgs.push(cfg);
      }
      return i;
    };
    const buf = new Array(n + 8);
    const keyOf = (k, p, cfg) => {
      for (let i = 0; i < n; i++) buf[i] = k.charCodeAt(p[i]);
      let m = n;
      buf[m++] = 124;                       // '|'
      const ds = '' + idOf(cfg);
      for (let j = 0; j < ds.length; j++) buf[m++] = ds.charCodeAt(j);
      return String.fromCharCode.apply(null, buf.slice(0, m));
    };
    const cfgAt = k => cfgs[+k.slice(n + 1)];
    const ident = new Int16Array(n);
    for (let i = 0; i < n; i++) ident[i] = i;
    const kh = keyOf(kit.home, ident, bk.HOME);
    const B = new Map([[kh, null]]);
    let front = [kh], tick = 0;
    while (front.length && B.size < BRUTE_HOME) {
      const next = [];
      grow: for (const k of front) {
        const cfg = cfgAt(k);
        for (let h = 0; h < turners.length; h++) {
          if (!bk.canTurn(cfg, h)) continue;
          for (const dir of [0, 1]) {
            const g = h * 2 + dir;
            /* One turn, and the same turn again, each a step of its own. On
               a board fused into lenses the answers run almost wholly in
               120-degree turns — measured, singles come at the ends and
               doubles are everything between — and a search that takes a
               double in one stride covers those answers in half the depth,
               which for a meeting in the middle is most of the battle. */
            const c1 = bk.shove(cfg, h, dir ^ 1);
            const k1 = keyOf(k, kit.gens[g ^ 1], c1);
            if (!B.has(k1)) {
              B.set(k1, { g, n: 1, from: k });
              next.push(k1);
              if (B.size >= BRUTE_HOME) break grow;
            }
            const k2 = keyOf(k1, kit.gens[g ^ 1], bk.shove(c1, h, dir ^ 1));
            if (!B.has(k2)) {
              B.set(k2, { g, n: 2, from: k });
              next.push(k2);
              if (B.size >= BRUTE_HOME) break grow;
            }
          }
        }
        if ((++tick & 1023) === 0) await new Promise(r => setTimeout(r, 0));
      }
      front = next;
    }
    bk.brute = { B, keyOf, cfgAt, ident, complete: !front.length };
  }
  const { B, keyOf, cfgAt, ident, complete } = bk.brute;
  // the turns that take a position the homeward side holds on to home
  const wayOn = k => {
    const w = [];
    for (let e = B.get(k); e; e = B.get(e.from)) { w.push(e.g); if (e.n === 2) w.push(e.g); }
    return w;
  };
  const k0 = keyOf(kit.read(), ident, bandNow(bk));
  if (B.has(k0)) return wayOn(k0);
  if (complete) return null;                // home's whole world, and not in it
  const A = new Map([[k0, null]]);
  const wayOut = k => {
    const w = [];
    for (let e = A.get(k); e; e = A.get(e.from)) { w.unshift(e.g); if (e.n === 2) w.unshift(e.g); }
    return w;
  };
  let front = [k0], tick = 0;
  while (front.length) {
    const next = [];
    for (const k of front) {
      const cfg = cfgAt(k);
      for (let h = 0; h < turners.length; h++) {
        if (!bk.canTurn(cfg, h)) continue;
        for (const dir of [0, 1]) {
          const g = h * 2 + dir;
          const c1 = bk.shove(cfg, h, dir);
          const k1 = keyOf(k, kit.gens[g], c1);
          if (!A.has(k1)) {
            if (B.has(k1)) return wayOut(k).concat(g, wayOn(k1));
            A.set(k1, { g, n: 1, from: k });
            next.push(k1);
            if (A.size >= BRUTE_SEEK) return null;
          }
          const k2 = keyOf(k1, kit.gens[g], bk.shove(c1, h, dir));
          if (!A.has(k2)) {
            if (B.has(k2)) return wayOut(k).concat(g, g, wayOn(k2));
            A.set(k2, { g, n: 2, from: k });
            next.push(k2);
            if (A.size >= BRUTE_SEEK) return null;
          }
        }
      }
      // let the page breathe now and then; this can run some seconds
      if ((++tick & 1023) === 0) await new Promise(r => setTimeout(r, 0));
    }
    front = next;
  }
  return null;
}

async function bandSolution(onStep) {
  const bk = bandKit, n = kit.n, goal = kit.home, tileOf = kit.tileOf;
  const walk = (s, p) => {
    let o = GAP;
    for (let i = 0; i < p.length; i++) o += s[p[i]];
    return o;
  };
  const miss = s => {
    let n2 = 0;
    for (let i = 0; i < s.length; i++) if (s[i] !== goal[i]) n2++;
    return n2;
  };
  const start = kit.read();
  const way = bk.wayHome(bandNow(bk));
  if (!way) {
    whyNoAnswer = 'The bandages cannot be walked back to where they started, ' +
      'or they roam too freely for the solver to find the way.';
    return null;
  }
  let s = start, seq = way.slice();
  for (const g of way) s = walk(s, kit.gens[g]);

  /* Seat the glued blocks. The first asking may set the seating search
     walking further out; every colouring on the chain after that is ground
     it has already covered. */
  for (;;) {
    const node = bk.seatWay(bk.blockParts.map(i => s[i]).join(GAP));
    if (!node) {
      whyNoAnswer = 'The glued pieces have ended up in an order the solver has ' +
        'no seating for. This bandaging is beyond it, not just this scramble.';
      return null;
    }
    if (!node.act) break;
    s = walk(s, node.act.p);
    seq = seq.concat(node.act.seq);
  }
  if (bk.triParity(s) === 1) {
    if (!bk.fixer) {
      whyNoAnswer = 'Two triangles are swapped and this bandaging has no move ' +
        'that swaps a pair back.';
      return null;
    }
    s = walk(s, bk.fixer.p);
    seq = seq.concat(bk.fixer.seq);
  }

  const placed = t => {
    let j = 0;
    outer: for (; j < bk.order.length; j++)
      for (const i of bk.tileParts[bk.order[j]]) if (t[i] !== goal[i]) break outer;
    return j;
  };
  const score = (pre, w) => w <= PLACE_ENDGAME ? 100000 - w * 100 + pre : pre * 100 - w;
  /* Said before the search rather than after it, since a library that cannot
     reach every tile will not come out however long it is left to run, and
     saying "try again" to that would be sending the player round in circles. */
  if (bk.short)
    whyNoAnswer = 'This bandaging leaves tiles that no move the solver has can ' +
      'reach. Another scramble may come out if it happens to leave those tiles ' +
      'alone, but cutting a seam back open is the surer way.';
  const trail = m => {
    const out = [];
    for (let node = m; node.via; node = node.back) out.unshift(...node.via);
    return out;
  };
  for (let attempt = 0; attempt < kit.tries; attempt++) {
    const t0 = performance.now();
    const root = { s, via: null, back: null, pre: placed(s), w: miss(s) };
    root.sc = score(root.pre, root.w);
    let beam = [root], top = root, idle = 0, relax = 0, round = 0;
    const seen = new Set([s]);
    while (performance.now() - t0 < kit.budget) {
      const endgame = beam[0].w <= PLACE_ENDGAME;
      const bad = new Set();
      if (endgame)
        for (let i = 0; i < beam[0].s.length; i++)
          if (beam[0].s[i] !== goal[i]) bad.add(tileOf[i]);
      const cand = [];
      for (const b of beam) {
        const floor = Math.max(0, b.pre - relax);
        const ceiling = b.pre + PLACE_FOCUS + relax * 4;
        for (const m of bk.moves) {
          if (endgame) { if (m.t3 && !m.t3.some(t => bad.has(t))) continue; }
          else { if (m.low < floor) continue; if (m.t3 && m.low > ceiling) continue; }
          const t = walk(b.s, m.p);
          if (seen.has(t)) continue;
          seen.add(t);
          const w = miss(t);
          if (w === 0) return seq.concat(trail({ via: m.seq, back: b }));
          const pre = placed(t);
          cand.push({ s: t, via: m.seq, back: b, pre, w, sc: score(pre, w), r: Math.random() });
        }
      }
      if (!cand.length) break;
      cand.sort((x, y) => y.sc - x.sc || x.r - y.r);
      beam = cand.slice(0, SOLVE_BEAM);
      if (seen.size > SOLVE_SEEN_CAP) { seen.clear(); for (const b of beam) seen.add(b.s); }
      if (beam[0].sc > top.sc) { top = beam[0]; idle = 0; relax = 0; }
      else {
        idle++;
        for (const [after, r] of PLACE_RELAX) if (idle === after) relax = r;
        if (idle >= PLACE_GIVE_UP) break;
        if (idle % 6 === 0 && beam[0].sc < top.sc) beam = [top];
      }
      if (onStep) onStep(beam[0].w, beam[0].pre, bk.order.length);
      if (++round % 2 === 0) await new Promise(r => setTimeout(r, 0));
    }
  }
  return null;
}

/* The descent. Yields to the page between rounds so the button can say what it
   is doing, and is tried again on a fresh tie-break if a round of it stalls —
   the time it takes varies a good deal from one scramble to the next. */
async function findSolution(onStep) {
  const goal = kit.home, from = kit.read();
  // the turned board, built straight as a string: it is its own key
  const walk = (s, p) => {
    let o = GAP;
    for (let i = 0; i < p.length; i++) o += s[p[i]];
    return o;
  };
  const miss = s => {
    let n = 0;
    for (let i = 0; i < s.length; i++) if (s[i] !== goal[i]) n++;
    return n;
  };
  whyNoAnswer = 'The search ran out of time before it closed. Scramble again ' +
    'and try once more.';
  if (bandaged) {
    const got = await bandSolution(onStep);
    if (got) return got;
    /* Whatever stopped the machinery — a starved library, a seating beyond
       its reach, a search that ran out — the direct search gets the last
       word. It is exact where it fits and cheap where it does not. */
    const direct = await bandBrute();
    if (!direct) whyNoAnswer += ' A direct search of every position within ' +
      'reach found no way through either.';
    return direct;
  }
  if (kit.reduce) return placeSolution(from, goal, walk, miss, onStep);
  for (let attempt = 0; attempt < kit.tries; attempt++) {
    const t0 = performance.now();
    /* Each candidate remembers the one it came from and the move that got it
       there, rather than the whole run of turns. Carrying the run would mean
       building an array for every candidate of every round — tens of thousands
       of them, growing by sixteen turns a round — which is enough allocation on
       its own to bring the page down. Only the winner's is ever assembled. */
    const trail = m => {
      const seq = [];
      for (let node = m; node.via; node = node.back) seq.unshift(...node.via);
      return seq;
    };
    let beam = [{ s: from, via: null, back: null }];
    const seen = new Set([from]);
    let floor = miss(from), idle = 0, round = 0;
    while (performance.now() - t0 < kit.budget) {
      /* While the descent is still finding its way down, the library is enough
         and is the same every round. Once it sticks, the moves that will shift
         it are the ones aimed at the tiles still wrong, so those are worked out
         for where it has got to and tried alongside. */
      const moves = idle >= SOLVE_AIM_AFTER
        ? kit.library.concat(aimedRepairs(beam[0].s)) : kit.library;
      const cand = [];
      for (const b of beam) for (const m of moves) {
        const s = walk(b.s, m.p);
        if (seen.has(s)) continue;
        seen.add(s);
        const w = miss(s);
        if (w === 0) return trail({ via: m.seq, back: b });
        cand.push({ s, via: m.seq, back: b, w, r: Math.random() });
      }
      if (!cand.length) break;
      cand.sort((x, y) => x.w - y.w || x.r - y.r);
      beam = cand.slice(0, SOLVE_BEAM);
      if (seen.size > SOLVE_SEEN_CAP) { seen.clear(); for (const b of beam) seen.add(b.s); }
      /* A descent that has stopped getting anywhere is better started again
         than waited out: the tie-break is random, so the next attempt takes a
         different way down and usually finds one. */
      if (beam[0].w < floor) { floor = beam[0].w; idle = 0; } else idle++;
      if (idle >= SOLVE_STALL) break;
      if (onStep) onStep(beam[0].w);
      // let the page draw now and then, without paying for it every round
      if (++round % 4 === 0) await new Promise(r => setTimeout(r, 0));
    }
  }
  return null;
}

/* How far the drawing has to reach, over the tiles this puzzle is playing on.
   Set apart from render() because the two puzzles are different sizes and the
   smaller one sits off to one side of the larger one's middle. */
function frame() {
  /* A puzzle may be stood at an angle, which the board is drawn at rather than
     the lattice being rebuilt: the tilt goes on the root, inside the flip, so
     everything below it — the turns, the bandages, the sweep of every arc — is
     worked out on the lattice as it always was. Only the reach has to know,
     since it is measuring the board as it ends up on screen. */
  const th = puzzle.tilt || 0, co = Math.cos(th), si = Math.sin(th);
  const deg = th * 180 / Math.PI;
  root.setAttribute('transform', `scale(1,-1) rotate(${deg.toFixed(4)})`);
  // the mark reads as a mark the right way up, so it takes the tilt back out
  for (const r of turners) {
    const m = r.mark.firstChild;            // the ring of it, wherever it stands
    const cx = +m.getAttribute('cx'), cy = +m.getAttribute('cy');
    r.mark.setAttribute('transform',
      `rotate(${(-deg).toFixed(4)} ${cx.toFixed(4)} ${cy.toFixed(4)})`);
  }

  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const reach = ([px, py]) => {
    const x = px * co - py * si, y = px * si + py * co;
    if (x < x0) x0 = x;
    if (y < y0) y0 = y;
    if (x > x1) x1 = x;
    if (y > y1) y1 = y;
  };
  // an arc on the rim of the board bulges past both its ends, so the middle of
  // every one of them has to be measured too
  for (const t of pieces) {
    for (let i = 0; i < t.outline.length; i++) {
      const [a, Z] = t.outline[i], b = t.outline[(i + 1) % t.outline.length][0];
      reach(a);
      if (Z) reach(arcMid(a, b, Z));
    }
  }
  /* The maths has y running up, the way the angles above are written, and SVG
     has it running down, so the board is flipped once in render() rather than
     every coordinate being negated at the point it is worked out. The viewBox
     is in the flipped frame, so its top edge is -y1. */
  document.getElementById('board').setAttribute('viewBox',
    [x0 - PAD, -y1 - PAD, x1 - x0 + 2 * PAD, y1 - y0 + 2 * PAD].join(' '));

  const n = s => [...onBoard].filter(t => t.sides === s).length;
  document.getElementById('counts').textContent =
    `${onBoard.size} tiles — ${n(6)} hexagons, ${n(4)} squares, ${n(3)} triangles.`;
}

/* One outline to a bandage. The pool grows to whatever a puzzle asks for
   rather than assuming six, so a board with more of them draws them all. */
const bandPool = [];
let bandLayer = null;
let root;                                   // the flipped, tilted frame it all sits in

function render() {
  const svg = document.getElementById('board');
  root = svgEl('g', { transform: 'scale(1,-1)' });

  const fills = svgEl('g', { 'stroke-width': '0.01' });
  for (const part of allParts) {
    part.el = svgEl('path', { class: 'part', d: pathOf(part.outline) });
    paint(part);
    fills.appendChild(part.el);
  }

  const edges = svgEl('g', { 'stroke-width': '0.05' });
  for (const t of pieces) {
    t.el = svgEl('path', { class: 'cell', d: pathOf(t.outline) });
    edges.appendChild(t.el);
  }

  // outlines for the bandages, filled in by refresh() wherever they have got to
  bandLayer = svgEl('g', { 'stroke-width': '0.05' });
  bandPool.length = 0;

  /* The no-turn mark: a ring with a bar across it, standing at the centre of
     each hexagon and shown while a bandage locks its collar. It never has to
     turn — a hexagon is only ever in its own collar, and a collar that will not
     turn does not move — so it sits in a layer of its own that nothing spins. */
  const MARK_R = 0.17, bar = MARK_R / Math.SQRT2;
  const marks = svgEl('g');
  for (const r of turners) {
    /* An inner ring is spoken for at the middle; an outer one out on the rim,
       where the ring itself is, at the top of the collar. */
    const cx = r.centre[0];
    const cy = r.centre[1] + (r.rings > 1 && r.ring === 1 ? (LAYER_R + ARC_R) / 2 : 0);
    r.mark = svgEl('g', { class: 'mark' });
    r.mark.append(
      svgEl('circle', { cx, cy, r: MARK_R }),
      // upper left to lower right on screen, so drawn the other way up here
      svgEl('line', { x1: cx - bar, y1: cy + bar, x2: cx + bar, y2: cy - bar }));
    r.mark.style.display = 'none';
    marks.appendChild(r.mark);
  }

  /* What is clicked, in a layer of its own over the top. Unlayered a collar
     is clicked on its hexagon, as it always was. Layered, the hexagon turns
     the inner ring and the band round the rim turns the outer one — drawn as
     the collar with the inner disc taken out of it, which the even-odd rule
     does from two circles in one path.

     The outer bands of neighbouring circles overlap a little near the middle
     of each triangle, so they are laid under the hexagons and the hover
     outline says which ring a click would take. */
  const hits = svgEl('g', { 'stroke-width': '0.06' });
  const ring = (cx, cy, a, b) =>
    `M${(cx - a).toFixed(4)},${cy.toFixed(4)}a${a},${a} 0 1 0 ${(2 * a).toFixed(4)},0` +
    `a${a},${a} 0 1 0 ${(-2 * a).toFixed(4)},0` +
    `M${(cx - b).toFixed(4)},${cy.toFixed(4)}a${b},${b} 0 1 0 ${(2 * b).toFixed(4)},0` +
    `a${b},${b} 0 1 0 ${(-2 * b).toFixed(4)},0`;
  const outers = [], inners = [];
  for (const r of turners) {
    const d = r.rings === 1 ? pathOf(r.hex.outline)
      : r.ring === 0 ? pathOf(r.hex.outline)
      : ring(r.centre[0], r.centre[1], ARC_R, LAYER_R);
    r.hit = svgEl('path', { class: 'hit', d, 'fill-rule': 'evenodd' });
    // read when the click happens, so the toggle takes effect at once
    r.hit.addEventListener('click', () => turn(r, clickDir()));
    r.hit.addEventListener('contextmenu', e => { e.preventDefault(); turn(r, -clickDir()); });
    (r.rings > 1 && r.ring === 1 ? outers : inners).push(r.hit);
  }
  for (const el of outers) hits.appendChild(el);
  for (const el of inners) hits.appendChild(el);

  /* The seams, over everything, since while they are being chosen they are
     what the board is for. Each is drawn twice: a fat transparent path to
     catch the pointer, and a thin one over it that shows. The grab comes
     first of the pair so the seam can be lit from its hover. */
  const seams = svgEl('g');
  for (const c of everyCut) {
    const d = arcPath(c.a, c.b, c.Z);
    c.grab = svgEl('path', { class: 'grab', d });
    c.line = svgEl('path', { class: 'cut', d });
    c.grab.addEventListener('click', () => toggleCut(c));
    c.grab.style.display = 'none';
    c.line.style.display = 'none';
    seams.append(c.grab, c.line);
  }

  root.append(fills, edges, bandLayer, marks, hits, seams);
  svg.replaceChildren(root);
  // right-clicking is a move, so the menu never wants to come up over the board
  svg.addEventListener('contextmenu', e => e.preventDefault());
}

/* Taking a seam out, or putting it back. The tables are one bandaging's, so
   they go; the board is at home while this is going on, so there is nothing
   to put straight beyond drawing it again. */
function toggleCut(c) {
  if (!cutting || !c.live) return;
  const gone = cutsGone();
  if (gone.has(c.key)) gone.delete(c.key); else gone.add(c.key);
  bandKit = null;
  redraw();
}

// said in the one place the toggles can change it, so they cannot disagree
function showHint() {
  const free = turners.filter(r => !stuck(r)).length;
  const el = document.getElementById('hint');
  if (cutting) {
    const n = bands.length;
    el.textContent =
      'Click a seam to glue the two tiles it parts, or a glued seam to cut it ' +
      'open again. ' +
      (n === 0 ? 'Nothing is glued yet.'
        : `${n} bandage${n === 1 ? '' : 's'} — ` +
          (free === 0
            ? 'and nothing on the board will turn. This one is welded solid.'
            : `${free} of ${turners.length} rings still free to turn.`));
    return;
  }
  const way = d => d > 0 ? 'anticlockwise' : 'clockwise';
  const two = turners.length > boardHexes.length;
  el.textContent = two
    ? `Click a hexagon to turn its inner layer ${way(clickDir())}, or the ring ` +
      `round the outside of a circle to turn both layers together; right-click ` +
      `for ${way(-clickDir())}.`
    : `Click a hexagon to turn its collar ${way(clickDir())}, ` +
      `right-click to turn it ${way(-clickDir())}.` +
    (bandaged ? ' A collar a bandage lies across will not turn.' : '') +
    (bandaged && free === 0 ? ' Nothing on this board will turn as it stands.' : '');
}

/* An answer is written down rather than played out. A settled run of turns on
   one hexagon is one to three of them the same way about, so it reads as the
   hexagon's letter and that many signs — R+ , R++ , W- — and the whole answer
   is a line of those. Stepping takes one at a time, and since a collar is a
   circle and turns onto itself at any angle, a run of two or three is shown as
   the one sweep of 120° or 180° that it is. */
let plan = null, planAt = 0;

const clearPlan = () => { plan = null; planAt = 0; showPlan(); };

// consecutive turns of the same hexagon the same way come out as one token
function asPlan(seq) {
  const out = [];
  for (let i = 0; i < seq.length; ) {
    let j = i;
    while (j < seq.length && seq[j] === seq[i]) j++;
    out.push({ hex: seq[i] >> 1, dir: (seq[i] & 1) ? -1 : 1, n: j - i });
    i = j;
  }
  return out;
}

// plus is clockwise, the way twisty-puzzle notation reads, though the model
// counts anticlockwise positive — the sign here is presentation, not maths
/* A move reads as the colour it turns and a sign for each sixth. Where a
   circle has two rings the inner one is written in lower case and the outer
   in capitals, so W+ and w+ are the two layers of white. */
const tokenText = t => {
  const r = turners[t.hex];
  const c = r.colour[0];
  return (r.rings > 1 && r.ring === 0 ? c.toLowerCase() : c.toUpperCase()) +
    (t.dir > 0 ? '-' : '+').repeat(t.n);
};

function showPlan() {
  const box = document.getElementById('plan'), nav = document.getElementById('nav');
  if (!plan) {
    box.style.display = 'none';
    box.replaceChildren();
    nav.style.display = 'none';
    return;
  }
  box.style.display = '';
  nav.style.display = '';
  document.getElementById('back').disabled = planAt <= 0;
  document.getElementById('step').disabled = planAt >= plan.length;
  document.getElementById('where').textContent = `${planAt} / ${plan.length}`;
  box.replaceChildren(...plan.map((t, i) => {
    const el = document.createElement('span');
    el.textContent = tokenText(t);
    el.className = i < planAt ? 'done' : i === planAt ? 'next' : '';
    el.title = `Wind the board back to just before this move`;
    // clicking a move winds to just before it, so it is the one coming next
    el.addEventListener('click', () => goTo(i));
    return el;
  }));
}

/* Anywhere in the answer, forwards or back. Every turn undoes, so winding back
   is the same walk the other way about. One move either side is shown turning;
   a longer jump is not, since watching forty of them go by is no use. */
function goTo(target) {
  if (!plan) return;
  target = Math.max(0, Math.min(plan.length, target));
  if (target === planAt) return;
  const single = Math.abs(target - planAt) === 1;
  settle();
  let last = null, way = 0;
  while (planAt < target) {
    last = plan[planAt];
    way = 1;
    for (let k = 0; k < last.n; k++) move(turners[last.hex], last.dir);
    planAt++;
  }
  while (planAt > target) {
    planAt--;
    last = plan[planAt];
    way = -1;
    for (let k = 0; k < last.n; k++) move(turners[last.hex], -last.dir);
  }
  repaint(); refresh();
  if (single && last) {
    const turn = last.dir * way;           // undoing a move runs it the other way
    spin(turners[last.hex], -turn * 60 * last.n, SPIN_MS + 70 * (last.n - 1));
  }
  showPlan();
}

function showSolveButton() {
  const b = document.getElementById('solve');
  const free = turners.filter(r => !stuck(r)).length;
  b.disabled = cutting || !free || !solvable();
  b.title = cutting ? 'Finish choosing the bandaging first'
    : puzzle.layered ? 'The solver does not know the layered boards yet'
    : !free ? 'Nothing on this board will turn, so there is nothing to solve'
    : 'Work out an answer for this board';
  // a board with nothing to turn cannot be scrambled either
  document.getElementById('scramble').disabled = cutting || !free;
  document.getElementById('cuts').textContent = cutting ? 'Done' : 'Choose bandages';
  document.getElementById('allcuts').style.display = cutting ? '' : 'none';
  // the bandaging as a code, there to copy out or paste over while choosing
  const code = document.getElementById('bandcode');
  code.style.display = cutting ? '' : 'none';
  if (cutting && document.activeElement !== code) code.value = bandCode();
}

// everything the board shows, after anything that changes what it should show
function redraw() {
  settle(); clearPlan(); reset(); render(); repaint(); refresh(); frame(); showHint();
  showSolveButton();
}

{
  const sel = document.getElementById('layout');
  for (const nm of Object.keys(PUZZLES)) {
    const opt = document.createElement('option');
    opt.value = nm;
    opt.textContent = PUZZLES[nm].name;
    sel.appendChild(opt);
  }
  sel.value = 'seven';
}
setPuzzle(PUZZLES.seven);
redraw();

document.getElementById('scramble').addEventListener('click', () => {
  clearPlan(); scramble(); showSolveButton();
});

/* The tables take a moment to build and the search a few seconds, so the line
   under the board reports as it goes and the page is let breathe between
   rounds. Kept for as long as the puzzle does not change. */
document.getElementById('solve').addEventListener('click', async () => {
  if (!solvable() || cutting) return;
  const say = t => { document.getElementById('hint').textContent = t; };
  const b = document.getElementById('solve');
  b.disabled = true;
  settle(); clearPlan();
  say('Working out an answer — building the moves to work with.');
  await new Promise(r => setTimeout(r, 0));
  if (!kit) kit = await buildKit(pc => say(`Working out an answer — building the moves to work with (${pc}%).`));
  if (bandaged && !bandKit)
    bandKit = await bandKitFor(m => say(`Working out an answer — ${m}.`));
  // the placing search knows how many tiles it has settled; the other does not
  const raw = await findSolution((n, done, all) => say(done === undefined
    ? `Working out an answer — ${n} parts still out of place.`
    : `Working out an answer — ${done} of ${all} tiles placed, ${n} parts out.`));
  showSolveButton();
  if (!raw) {
    say('No answer found. ' + whyNoAnswer);
    /* One line to the console with everything a report needs: the bandaging
       as its code, what the tables came out as, and why it gave up. */
    if (bandaged && bandKit)
      console.log('solver: no answer | ' + bandCode() +
        ' | depth ' + bandKit.depth + (bandKit.capped ? ' capped' : '') +
        ' | keepers ' + bandKit.keepers.length +
        ' | moves ' + bandKit.moves.length +
        ' | short ' + bandKit.short + ' | seatGap ' + bandKit.seatGap +
        ' | ' + whyNoAnswer);
    return;
  }
  const loose = simplifySolution(raw);
  /* Tightening swaps a stretch of the answer for a shorter run of turns out of
     a table that knows nothing about bandages, so on a glued board almost any
     swap it made would be a run that cannot be played. Simplifying is safe —
     cancelling turns of one hexagon against each other leaves every bandage
     where the rest of the answer expects it. */
  let tight = loose;
  if (!bandaged) {
    say('Working out an answer — tightening it.');
    await new Promise(r => setTimeout(r, 0));
    tight = simplifySolution(tightenSolution(loose));
  }
  plan = asPlan(tight);
  planAt = 0;
  showPlan();
  const turns = plan.reduce((n, t) => n + t.n, 0);
  say(`${turns} turns in ${plan.length} moves, down from ${raw.length}. ` +
      `Step through them with the arrows, or click a move to wind there.`);
});
document.getElementById('step').addEventListener('click', () => goTo(planAt + 1));
document.getElementById('back').addEventListener('click', () => goTo(planAt - 1));
document.getElementById('reset').addEventListener('click', () => {
  settle(); clearPlan(); reset(); repaint(); refresh(); showHint(); showSolveButton();
});
document.getElementById('invert').addEventListener('change', e => {
  inverted = e.target.checked;
  showHint();
});
/* Changing the puzzle puts the board back to the start. Where the bandages
   would go on a board already scrambled has no answer — they were never
   carried through those turns — and dropping them onto it could leave colours
   that no run of bandaged moves can reach. */
/* A second layer is a different board — more pieces, and two rings to a
   circle — so it is rebuilt from the ground up, and the bandaging goes with
   the old one since its seams are gone. */
document.getElementById('layered').addEventListener('change', e => {
  puzzle.layered = e.target.checked;
  if (puzzle.gone) puzzle.gone.clear();
  cutting = false;
  kit = null;
  bandKit = null;
  setPuzzle(puzzle);
  redraw();
});
document.getElementById('layout').addEventListener('change', e => {
  setPuzzle(PUZZLES[e.target.value]);
  document.getElementById('layered').checked = !!puzzle.layered;
  redraw();
});

/* Choosing the bandaging. It is chosen at home — a bandage is named by the
   tiles under it and a scrambled board has them somewhere else — so opening
   the chooser puts the board back, which redraw() does anyway. */
document.getElementById('cuts').addEventListener('click', () => {
  cutting = !cutting;
  bandKit = null;
  redraw();
});
document.getElementById('allcuts').addEventListener('click', () => {
  cutsGone().clear();
  bandKit = null;
  redraw();
});
document.getElementById('bandcode').addEventListener('change', e => {
  if (!applyBandCode(e.target.value)) e.target.value = bandCode();
  e.target.blur();
});
</script>
