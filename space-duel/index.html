<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Space Duel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = 1024;
canvas.height = 768;

const shipImg = new Image();
shipImg.src = 'ship.png';

const B = 32;
const SHIP_R = 16;
const BOUNCE = 1.25; // restitution > 1 = springy walls

const degToRad = d => d * Math.PI / 180;

// --- Block constructors ---
const rect  = (x, y, w=B, h=B) => ({type:'rect', x, y, w, h});
const tri   = (v0, v1, v2)     => ({type:'tri',  verts:[v0,v1,v2]});
const circ  = (cx, cy, r)      => ({type:'circle', cx, cy, r});
const hWall = (x, y, n) => Array.from({length:n}, (_,i) => rect(x+i*B, y));
const vWall = (x, y, n) => Array.from({length:n}, (_,i) => rect(x, y+i*B));

// --- Map ---
const blocks = [
  ...hWall(64, 32, 28),
  ...hWall(64, 704, 28),
  ...vWall(64, 64, 20),
  ...vWall(928, 64, 20),

  // "/" diagonal — top-left
  tri([96,64],[352,64],[96,320]),

  // "\" diagonal — bottom-right
  tri([672,448],[928,448],[928,704]),

  // Upper horizontal wall (x: 512–736, y: 192) with angled caps
  ...hWall(512, 192, 7),
  tri([480,192],[512,192],[512,224]),
  tri([736,192],[768,192],[736,224]),

  // Lower horizontal wall (x: 288–512, y: 544) with angled caps
  ...hWall(288, 544, 7),
  tri([256,544],[288,544],[288,576]),
  tri([512,544],[512,576],[480,544]),

  // Circular pillars
  circ(512, 384, 48),
  circ(752, 256, 40),
  circ(272, 512, 40),
];

// --- Boosters ---
// angle: GML convention (0=right, 90=up-screen, 180=left, 270=down-screen)
const BOOST_RADIUS   = 22;  // trigger distance
const BOOST_IMPULSE  = 18;
const BOOST_COOLDOWN = 60;  // steps (2 s at 30 fps)

const boosters = [
  { x:450, y:150, angle:270 },  // above upper wall  → push down
  { x:820, y:370, angle:180 },  // right corridor    → push left
  { x:200, y:380, angle:0   },  // left corridor     → push right
  { x:600, y:610, angle:90  },  // below lower wall  → push up
  { x:660, y:290, angle:225 },  // near upper-right pillar → push down-left
  { x:360, y:470, angle:45  },  // near lower-left pillar  → push up-right
].map(b => ({ ...b, cooldown:0 }));

// --- Geometry ---
function closestOnSeg(px, py, ax, ay, bx, by) {
  const dx=bx-ax, dy=by-ay, len2=dx*dx+dy*dy;
  if (len2===0) return [ax,ay];
  const t = Math.max(0, Math.min(1, ((px-ax)*dx+(py-ay)*dy)/len2));
  return [ax+t*dx, ay+t*dy];
}

function pointInTri(px, py, [[x1,y1],[x2,y2],[x3,y3]]) {
  const s = (ax,ay,bx,by) => (px-bx)*(ay-by)-(ax-bx)*(py-by);
  const d1=s(x1,y1,x2,y2), d2=s(x2,y2,x3,y3), d3=s(x3,y3,x1,y1);
  return !((d1<0||d2<0||d3<0) && (d1>0||d2>0||d3>0));
}

function collide(sx, sy, b) {
  if (b.type === 'rect') {
    const cx=Math.max(b.x,Math.min(sx,b.x+b.w));
    const cy=Math.max(b.y,Math.min(sy,b.y+b.h));
    const dx=sx-cx, dy=sy-cy, d2=dx*dx+dy*dy;
    if (d2 >= SHIP_R*SHIP_R) return null;
    const d=Math.sqrt(d2)||0.001;
    return {nx:dx/d, ny:dy/d, overlap:SHIP_R-d};
  }
  if (b.type === 'tri') {
    let minD2=Infinity, cpx=0, cpy=0;
    for (let i=0;i<3;i++) {
      const [ax,ay]=b.verts[i], [bx,by]=b.verts[(i+1)%3];
      const [px,py]=closestOnSeg(sx,sy,ax,ay,bx,by);
      const d2=(sx-px)**2+(sy-py)**2;
      if (d2<minD2) { minD2=d2; cpx=px; cpy=py; }
    }
    const d=Math.sqrt(minD2), inside=pointInTri(sx,sy,b.verts);
    if (!inside && d>=SHIP_R) return null;
    const dx=sx-cpx, dy=sy-cpy, len=d||0.001;
    return inside
      ? {nx:-(dx/len), ny:-(dy/len), overlap:SHIP_R+d}
      : {nx:  dx/len,  ny:  dy/len,  overlap:SHIP_R-d};
  }
  if (b.type === 'circle') {
    const dx=sx-b.cx, dy=sy-b.cy, d=Math.sqrt(dx*dx+dy*dy)||0.001;
    if (d >= b.r+SHIP_R) return null;
    return {nx:dx/d, ny:dy/d, overlap:b.r+SHIP_R-d};
  }
  return null;
}

// --- Ship ---
const ship = { x:350, y:500, speedX:0, speedY:0, speed:0, facing:90 };

const keys={}, justPressed={};
window.addEventListener('keydown', e => {
  if (!keys[e.code]) justPressed[e.code]=true;
  keys[e.code]=true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code]=false; });

function step() {
  if (keys['ArrowLeft'])  ship.facing += 8;
  if (keys['ArrowRight']) ship.facing -= 8;

  if (justPressed['ArrowUp']) {
    ship.speedX += 10 * Math.cos(degToRad(ship.facing));
    ship.speedY += 10 * Math.sin(degToRad(ship.facing));
    ship.speed  += 10;
  }

  ship.speedX = 0.90*ship.speedX + 0.05*ship.speed*Math.cos(degToRad(ship.facing));
  ship.speedY = 0.90*ship.speedY + 0.05*ship.speed*Math.sin(degToRad(ship.facing));
  ship.speed  = Math.sqrt(ship.speedX**2 + ship.speedY**2);

  ship.x += ship.speedX;
  ship.y -= ship.speedY;

  // Wall collisions (2 passes)
  for (let pass=0; pass<2; pass++) {
    for (const b of blocks) {
      const col = collide(ship.x, ship.y, b);
      if (!col) continue;
      ship.x += col.nx * col.overlap;
      ship.y += col.ny * col.overlap;
      const svx=ship.speedX, svy=-ship.speedY;
      const dot=svx*col.nx + svy*col.ny;
      if (dot < 0) {
        ship.speedX = svx - (1+BOUNCE)*dot*col.nx;
        ship.speedY = -(svy - (1+BOUNCE)*dot*col.ny);
        ship.speed  = Math.sqrt(ship.speedX**2 + ship.speedY**2);
      }
    }
  }

  // Booster triggers
  for (const bst of boosters) {
    if (bst.cooldown > 0) { bst.cooldown--; continue; }
    const dx=ship.x-bst.x, dy=ship.y-bst.y;
    if (dx*dx+dy*dy < BOOST_RADIUS*BOOST_RADIUS) {
      ship.speedX += BOOST_IMPULSE * Math.cos(degToRad(bst.angle));
      ship.speedY += BOOST_IMPULSE * Math.sin(degToRad(bst.angle));
      ship.speed   = Math.sqrt(ship.speedX**2 + ship.speedY**2);
      bst.cooldown = BOOST_COOLDOWN;
    }
  }

  for (const k in justPressed) delete justPressed[k];
}

// --- Draw ---
function drawBlock(b) {
  ctx.fillStyle='#555';
  ctx.strokeStyle='#888';
  ctx.lineWidth=1;
  if (b.type==='rect') {
    ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.strokeRect(b.x+0.5,b.y+0.5,b.w-1,b.h-1);
  } else if (b.type==='tri') {
    ctx.beginPath();
    ctx.moveTo(b.verts[0][0],b.verts[0][1]);
    ctx.lineTo(b.verts[1][0],b.verts[1][1]);
    ctx.lineTo(b.verts[2][0],b.verts[2][1]);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  } else if (b.type==='circle') {
    ctx.beginPath();
    ctx.arc(b.cx,b.cy,b.r,0,Math.PI*2);
    ctx.fill(); ctx.stroke();
  }
}

function drawBooster(bst) {
  const active = bst.cooldown <= 0;
  ctx.save();
  ctx.translate(bst.x, bst.y);
  ctx.rotate(degToRad(-bst.angle + 90));
  ctx.beginPath();
  ctx.moveTo(0, -14);
  ctx.lineTo(-11, 8);
  ctx.lineTo(11, 8);
  ctx.closePath();
  ctx.fillStyle = active ? '#ffcc00' : '#887700';
  ctx.fill();
  ctx.restore();
}

function draw() {
  ctx.fillStyle = '#131414';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (const b of blocks) drawBlock(b);
  for (const bst of boosters) drawBooster(bst);
  ctx.save();
  ctx.translate(ship.x, ship.y);
  ctx.rotate(degToRad(-ship.facing + 90));
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(shipImg, -16, -16, 32, 32);
  ctx.restore();
}

const MS_PER_FRAME = 1000/30;
let lastTime=null, accumulator=0;
function loop(ts) {
  if (lastTime===null) lastTime=ts;
  accumulator+=ts-lastTime; lastTime=ts;
  while (accumulator>=MS_PER_FRAME) { step(); accumulator-=MS_PER_FRAME; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
